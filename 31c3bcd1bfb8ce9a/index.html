<script>
const DATA=[{"key": "L1", "title": "L1 - pH, Buffer & Bonds", "section": "Mid", "sections": [{"title": "Acids, bases & pH", "points": [{"t": "**Acid** = a substance that **releases** H⁺ (protons). **Base** = a substance that **accepts** H⁺.", "past": false, "trap": "Acid releases H⁺; base accepts H⁺ (bases do not release H⁺).", "src": "p3"}, {"t": "**pH = −log₁₀[H⁺]**. pH and [H⁺] have an **inverse relationship**; pH is used because it is **easier to calculate** and easier to deal with.", "past": true, "trap": "", "src": "p3"}, {"t": "Worked example: [H⁺] = **3.2 × 10⁻⁴ mol/L** → pH = −log 3.2 − log 10⁻⁴ = **−0.5 + 4 = 3.5**.", "past": false, "trap": "", "src": "p3"}]}, {"title": "Ka & pKa", "points": [{"t": "When an acid (HA) loses a proton it forms its **conjugate base (A⁻)**, also called the **salt**. **Ka** = the tendency of an acid to lose a proton.", "past": false, "trap": "", "src": "p4"}, {"t": "**Strong acids dissociate completely** (e.g. **HCl** → Cl⁻ + H⁺). **Weak acids dissociate only to a limited extent** (e.g. **H₂CO₃** ⇌ HCO₃⁻ + H⁺).", "past": false, "trap": "", "src": "p4"}, {"t": "**pKa = −log Ka**, and **pKa is the pH at which 50% dissociation occurs**.", "past": false, "trap": "", "src": "p5"}, {"t": "The **stronger the acid** → the **higher its Ka** and the **lower its pKa**.", "past": true, "trap": "A strong acid has a HIGH Ka but a LOW pKa.", "src": "p5"}]}, {"title": "Buffers", "points": [{"t": "**Buffer** = a solution that **resists pH changes** when acids or bases are added. It is made of a **weak (undissociated) acid + its conjugate base**, e.g. CH₃COOH / CH₃COO⁻.", "past": true, "trap": "A buffer is a WEAK acid + its conjugate base, never a strong acid + strong base.", "src": "p6"}, {"t": "Added **acid (H⁺)** is neutralized by the **conjugate base (A⁻)** → HA. Added **base** is neutralized by the **acid (HA)** → A⁻.", "past": true, "trap": "Added bases are neutralized by HA, not by the conjugate base.", "src": "p6"}, {"t": "**Two factors** decide buffer effectiveness: (1) its **pKa relative to the pH** of the solution, (2) its **concentration**.", "past": false, "trap": "", "src": "p6"}]}, {"title": "Henderson-Hasselbalch equation", "points": [{"t": "**pH = pKa + log([A⁻]/[HA])** relates **pH, pKa, acid concentration and conjugate-base concentration**.", "past": true, "trap": "The equation does NOT say pH = pKa in all conditions.", "src": "p7"}, {"t": "The **most effective buffer** is at **pH = pKa**: **[A⁻] = [HA]** (50% of each form), so it responds **equally** to added acid and added base.", "past": true, "trap": "The best buffer is defined by equal concentrations, not by pH 7 or 7.4.", "src": "p5"}, {"t": "If [acid] = [conjugate base], log 1 = 0 → **pH = pKa**. Past example: 0.35 / 0.35 at pH 4.6 → **pKa = 4.6**.", "past": true, "trap": "", "src": "p7"}, {"t": "From the equation: **pH > pKa → more conjugate base** than acid; **pH < pKa → more acid (HA)**, i.e. less dissociation.", "past": true, "trap": "Below the pKa the acid stays mostly undissociated (HA).", "src": "p7"}, {"t": "At **pH = pKa ± 1** the buffer capacity falls to **33%** of its maximum, so a buffer is effective **one unit** above or below its pKa.", "past": false, "trap": "", "src": "p7"}]}, {"title": "Chemical bonds: ionic & covalent", "points": [{"t": "**Ionic bond**: electrons **completely transferred**, ions held by **electrostatic forces**; forms between **metals and non-metals**; metal named first (sodium chloride).", "past": false, "trap": "", "src": "p8"}, {"t": "Ionic compounds **dissolve easily in water** and polar solvents, **conduct electricity in solution**, and form **crystalline solids with high melting points**.", "past": false, "trap": "", "src": "p8"}, {"t": "**Covalent bond**: **sharing** of electron pairs between atoms with a **similar tendency** for electrons. **Polar** = **unequal** sharing (different electronegativity); **nonpolar** = **equal** sharing (same electronegativity).", "past": false, "trap": "", "src": "p9"}]}, {"title": "Electronegativity values", "table": {"head": ["Element", "Electronegativity"], "rows": [["**F**", "**4.0** (highest)"], ["**O**", "**3.5**"], ["**N** · **Cl**", "**3.0**"], ["**C**", "**2.5**"], ["**H** · **P**", "**2.1**"], ["**Mg**", "1.2"], ["**Ca**", "1.0"], ["**Na**", "0.9"], ["**K**", "0.8"]]}}, {"title": "Electronegativity rule", "points": [{"t": "**Electronegativity** = the ability of an atom to **attract electrons toward itself** in a covalent bond (in water, **O** pulls the electrons more than H).", "past": false, "trap": "", "src": "p10"}, {"t": "Electronegativity difference: **< 0.5 → nonpolar**; **0.5 to 2 → polar covalent**; **> 2.0 → ionic**.", "past": true, "trap": "P–H (0 difference) and P–C (0.4) are nonpolar; Cl–H (0.9) and P–Ca (1.1) are polar covalent.", "src": "p10"}]}, {"title": "Hydrogen bond, hydrophobic interactions & van der Waals", "points": [{"t": "**Hydrogen bond**: an H covalently bonded to an electronegative atom is attracted to another electronegative atom — **nitrogen, oxygen or fluorine** (δ+ H to δ− region).", "past": true, "trap": "Phosphorus does NOT form hydrogen bonds; the atoms are N, O and F.", "src": "p11"}, {"t": "Strength: **H-bond is stronger than van der Waals** but **weaker than covalent and ionic** bonds. **Van der Waals = the weakest**: transient attractions between **neutral** atoms; size depends on **distance**.", "past": false, "trap": "Order: covalent/ionic > hydrogen bond > van der Waals.", "src": "p11"}, {"t": "Salt in water: both are **polar**; water pulls **Na⁺ and Cl⁻** apart. The **positive** side of water surrounds **Cl⁻**, the **negative** side surrounds **Na⁺** → a **homogeneous** solution.", "past": false, "trap": "", "src": "p12"}, {"t": "**Hydrophobic interactions**: nonpolar groups **cannot H-bond** with water → insoluble, **excluded** from water, so they **cluster together**; only van der Waals forces hold them.", "past": false, "trap": "", "src": "p13"}]}]}, {"key": "L2", "title": "L2 - Functional Groups", "section": "Mid", "sections": [{"title": "Functional groups", "points": [{"t": "**Functional groups** = specific groups of atoms or bonds responsible for a molecule's characteristic reactions; the **same group gives the same reaction regardless of molecule size**.", "past": false, "trap": "", "src": "p2"}, {"t": "Elements involved: **C, N, O, H, P**. Bonds formed: **carbon 4, nitrogen 3, oxygen 2, hydrogen 1**.", "past": false, "trap": "Nitrogen makes 3 bonds, not 4.", "src": "p2"}]}, {"title": "The seven groups", "table": {"head": ["Group", "Formula", "Key property", "Example"], "rows": [["Hydrocarbons", "**-CH3** (methyl end)", "**hydrophobic**; backbone of most organic molecules", "**methane**"], ["Alcohols", "**-OH** (hydroxyl)", "polar, hydrophilic; dissolve easily; good fuels", "**ethanol**"], ["Organic phosphates", "**-PO3**", "usually **acidic**", "in **ATP** and **DNA**"], ["Carboxylic acids", "**COOH** (carboxyl)", "water soluble **weak acids** (organic acids)", "**acetic acid** (vinegar)"], ["Amines", "**NH2** (amino)", "water soluble **weak bases**", "**ammonia**"], ["Aldehydes", "**COH**", "polar, hydrophilic", "**formaldehyde**"], ["Ketones", "**RCOR**", "polar, hydrophilic; in many **steroids**", "**acetone**"]]}}, {"title": "Functional groups: what the exam asks", "points": [{"t": "Name the group from its formula: **COOH = carboxyl**, **NH2 = amino**, **OH = hydroxyl**.", "past": true, "trap": "COOH is carboxyl, not carbonyl or hydroxyl.", "src": "p2"}, {"t": "**Hydrocarbons are hydrophobic**; **alcohols, carboxylic acids, amines, aldehydes and ketones** are all **polar and hydrophilic**.", "past": false, "trap": "Hydrocarbons are the hydrophobic one in the list.", "src": "p3"}, {"t": "Acid/base: **carboxylic acids = weak acids**, **amines = weak bases**, **organic phosphates = usually acidic**.", "past": false, "trap": "Amines are weak bases; carboxylic acids are weak acids.", "src": "p2"}]}, {"title": "Biomolecules & metabolism", "points": [{"t": "**Micromolecules**: inorganic (**water, minerals**) and organic (**monosaccharides, amino acids, fatty acids, nucleotides**). **Macromolecules**: **polysaccharides, proteins, some lipids, nucleic acids**.", "past": false, "trap": "", "src": "p5"}, {"t": "Micro → macro = **synthesis** (**requires energy**); macro → micro = **hydrolysis/breakdown** (**liberates energy**). This interconversion = **metabolism** = **anabolism** (synthesis) + **catabolism** (breakdown).", "past": true, "trap": "Anabolism builds macromolecules; catabolism breaks them down.", "src": "p4"}, {"t": "**Growth and development → anabolism**; **physical activity** (muscle movement) **→ catabolism**.", "past": false, "trap": "", "src": "p4"}, {"t": "Units are linked by covalent bonds: monosaccharides by **glycosidic bonds**, amino acids by **peptide bonds** (between carboxyl and amino groups).", "past": true, "trap": "Glycosidic = sugars; peptide = amino acids.", "src": "p8"}]}, {"title": "Carbohydrates (intro)", "points": [{"t": "**Carbohydrates = fast energy, 4 kcal/g**; **lipids = long-term storage, 9 kcal/g**.", "past": false, "trap": "4 kcal/g for carbohydrates vs 9 kcal/g for lipids.", "src": "p6"}, {"t": "Monosaccharides have **3 to 7 carbons**, formula **(CH2O)n** (glucose **C6H12O6**): trioses → heptoses. All contain **-OH groups** plus an **aldehyde or ketone**.", "past": false, "trap": "", "src": "p6"}, {"t": "Glucose cyclizes when the **C1 aldehyde** reacts with the **C5 OH** → intramolecular **hemiacetal**, a **6-membered pyranose ring**, drawn as **Haworth projections**.", "past": false, "trap": "", "src": "p6"}, {"t": "**Polysaccharides** = polymers made **without a template**, joined by glycosidic bonds, linear to highly branched; they differ in **unit identity, chain length and degree of branching**.", "past": false, "trap": "", "src": "p7"}]}, {"title": "Proteins, enzymes & nucleic acids", "points": [{"t": "**Amino acid** = **amine (-NH2) + carboxylic acid (-COOH)** + a specific **side chain**. A **polypeptide** = linear chain of amino acids joined by **peptide bonds**.", "past": false, "trap": "", "src": "p8"}, {"t": "**Enzymes** convert **substrates → products** at the **active site** (a pocket or cleft); many need small molecules called **cofactors**.", "past": false, "trap": "", "src": "p8"}, {"t": "**Six enzyme classes**: oxidoreductases · **transferases** (move methyl/phosphate) · **hydrolases** · **lyases** (cleave, not by hydrolysis or oxidation) · **isomerases** (within one molecule) · **ligases** (**join two molecules by covalent bonds**).", "past": true, "trap": "Ligases join two molecules; lyases cleave bonds without hydrolysis or oxidation.", "src": "p9"}, {"t": "**Nucleotide** = **sugar** (**ribose in RNA**, **deoxyribose in DNA**) + **phosphate** + **nitrogenous base** (A, C, G, T).", "past": true, "trap": "Deoxyribose is the DNA sugar; ribose is the RNA sugar.", "src": "p9"}]}, {"title": "Lipids", "points": [{"t": "Lipids: long-term energy store, **padding and insulation**, store **fat-soluble vitamins (A, D, E)**, backbone of **hormones and cell membranes**.", "past": false, "trap": "", "src": "p10"}, {"t": "**Fats** = three fatty acids + glycerol ester, saturated or unsaturated; **essential fatty acids = linoleic and linolenic**. **Waxes** = much longer fatty acids → **higher melting point**.", "past": false, "trap": "", "src": "p10"}, {"t": "**Phospholipids**: one fatty acid replaced by a **phosphate**; glycerol ester **hydrophilic**, fatty-acid chains **hydrophobic**. **Steroids** = **least common** lipids, high H:C ratio (**cholesterol, testosterone, estrogen**).", "past": false, "trap": "", "src": "p10"}]}, {"title": "Water", "points": [{"t": "Most of water's properties come from **hydrogen bonding**. Excellent solvent: **ionic** compounds dissociate, **polar covalent** dissolve (**hydrophilic**), **nonpolar** do not (**hydrophobic**).", "past": false, "trap": "", "src": "p11"}, {"t": "**High cohesion** → (1) **high surface tension** (insects run on water) and (2) **strong capillary action** (liquid rises in a straw, more in **thinner** straws).", "past": false, "trap": "", "src": "p11"}, {"t": "**High specific heat capacity**: sweat cools the body, oceans insulate at night. On freezing, H-bonds form **hollow cells** → **ice is less dense than liquid water**.", "past": false, "trap": "Ice is LESS dense than liquid water.", "src": "p12"}]}]}, {"key": "L3", "title": "L3 - Carbohydrates 1", "section": "Mid", "sections": [{"title": "Classification of carbohydrates", "points": [{"t": "Carbohydrates = **sugars / saccharides** with empirical formula **(CH2O)n, n ≥ 3**.", "past": false, "trap": "", "src": "p3"}, {"t": "**Same empirical formula**: glucose, ribose, glyceraldehyde. **Molecular formula**: glucose **C6H12O6**, ribose **C5H10O5**.", "past": false, "trap": "", "src": "p3"}, {"t": "**Monosaccharides** = basic units that **cannot be hydrolyzed** (glucose, galactose, fructose). **Disaccharides** = two units by a covalent **glycosidic bond** (**sucrose = glucose + fructose**). **Polysaccharides**: starch, cellulose, glycogen.", "past": true, "trap": "", "src": "p3"}]}, {"title": "Monosaccharides", "points": [{"t": "Classified by **number of carbons** (trioses, tetroses, pentoses, hexoses) and by the **carbonyl group**: **aldoses** (aldehyde) or **ketoses** (ketone).", "past": false, "trap": "", "src": "p4"}, {"t": "**Glucose = aldohexose** (C=O at **C1**); **fructose = ketohexose** (C=O at **C2**). **Glyceraldehyde = aldotriose**; **dihydroxyacetone = ketotriose**.", "past": true, "trap": "", "src": "p4"}, {"t": "Nicknames: **glucose = blood / grape sugar** · **fructose = fruit sugar** · **lactose = milk sugar** · **sucrose = table sugar**.", "past": true, "trap": "Past distractors swap them: sucrose is table sugar, lactose is milk sugar.", "src": "p4"}, {"t": "**C6H12O6** sugars: **glucose, galactose, fructose, mannose**. **Ribose (C5H10O5)** is NOT, so it is not an isomer of glucose.", "past": true, "trap": "Ribose is the EXCEPT: a pentose, not C6H12O6.", "src": "p4"}]}, {"title": "Isomer types at a glance", "table": {"head": ["", "Definition", "Example"], "rows": [["**Structural (constitutional)**", "same formula, atoms/groups **bound differently**", "**glucose & fructose**; glyceraldehyde & dihydroxyacetone"], ["**Enantiomers**", "**mirror images**, **not superimposable**", "**D- & L-glucose**"], ["**Epimers**", "differ at **only one** chiral center, **not** mirror images", "glucose & **galactose (C4)**; glucose & **mannose (C2)**"]]}}, {"title": "Isomerism & chirality", "points": [{"t": "**Isomers** = same **molecular formula**, different structure. **Structural isomers**: different connectivity — **glucose and fructose**; **glyceraldehyde and dihydroxyacetone** (aldehyde vs ketone).", "past": true, "trap": "Glucose and fructose are structural isomers, NOT stereoisomers or enantiomers.", "src": "p5"}, {"t": "**Stereoisomers** differ in the **configuration of atoms in space**, not in the order of connectivity. A structural isomer is therefore **not** a stereoisomer.", "past": true, "trap": "", "src": "p5"}, {"t": "**Chiral carbon** = asymmetric carbon bonded to **4 different groups**. A chiral molecule needs **at least one** chiral center; chiral objects (hands) **cannot be superimposed**.", "past": false, "trap": "", "src": "p5"}, {"t": "**Number of stereoisomers = 2ⁿ** (n = chiral centers): **glucose 2⁴ = 16** · **fructose 8** · **glyceraldehyde 2** · **dihydroxyacetone 1** (no chiral carbon).", "past": true, "trap": "Count the chiral carbons first; the answer is always a power of 2 (ribose in the past exam: 3 → 8).", "src": "p7"}]}, {"title": "Enantiomers & D/L system", "points": [{"t": "**Enantiomers** = two stereoisomers that are **mirror images** but **not superimposable** (every chiral center reversed); they are **chiral** and **optically active**.", "past": true, "trap": "Enantiomers are never superimposable.", "src": "p7"}, {"t": "**D/L system** names **sugars and amino acids**: OH on the **farthest chiral carbon from the carbonyl** (C5 in hexoses) on the **right = D**, on the **left = L**.", "past": true, "trap": "Judge D/L by the farthest chiral carbon from C=O, not by C2.", "src": "p8"}, {"t": "**Most naturally occurring sugars are D-isomers** (the biologically active form).", "past": false, "trap": "", "src": "p8"}]}, {"title": "Optical activity", "points": [{"t": "Enantiomers rotate **plane-polarized light** (polarimeter): **clockwise = (+) or (d), dextrorotatory**; **counterclockwise = (−) or (l), levorotatory**.", "past": true, "trap": "", "src": "p8"}, {"t": "**D/L is NOT (+)/(−)**: **D-glucose (dextrose) is dextrorotatory**, but **D-fructose (laevulose) is levorotatory**. D-glyceraldehyde happens to be dextrorotatory.", "past": true, "trap": "Counterclockwise rotation means (−)/(l), not L; D-fructose is levorotatory.", "src": "p8"}, {"t": "**Dextrose = D-glucose**: a **hexose**, the **blood sugar**, **dextrorotatory**; not a disaccharide and not levorotatory.", "past": true, "trap": "", "src": "p8"}, {"t": "**Racemic mixture** = **equal amounts** of each enantiomer → **net rotation = zero**.", "past": false, "trap": "", "src": "p8"}]}, {"title": "Epimers", "points": [{"t": "**Epimers** = stereoisomers that differ at **only one chiral center**; they are **not mirror images**.", "past": true, "trap": "One chiral center changed = epimer; all reversed = enantiomer.", "src": "p9"}, {"t": "**Glucose & galactose = C4 epimers**; **glucose & mannose = C2 epimers**.", "past": true, "trap": "Galactose differs at C4, mannose at C2.", "src": "p9"}]}]}, {"key": "L4", "title": "L4 - Carbohydrates 2", "section": "Mid", "sections": [{"title": "Types of stereoisomers", "table": {"head": ["", "Definition", "Key example / fact"], "rows": [["**Enantiomers**", "**mirror images**, **not superimposable**", "D/L system; most natural sugars are **D**; **optically active**"], ["**Epimers**", "differ at **only one** chiral center; **not** mirror images", "glucose–galactose = **C4**; glucose–mannose = **C2**"], ["**Anomers**", "differ around the **anomeric carbon** (cyclic sugars)", "**α and β**; D-glucose: **β 63.6%**, α 36.4%"], ["**Conformers**", "**chair or boat** shapes of the ring", "ring carbons **tetrahedral** (~**109.5°**), ring not planar"]]}}, {"title": "Isomerization", "points": [{"t": "**Constitutional (structural) isomers**: same formula, atoms bound in different ways (e.g. **glucose and fructose**). **Stereoisomers**: same bonds, different **configuration in space**.", "past": false, "trap": "", "src": "p3"}, {"t": "**Enantiomers** = mirror images that are **not superimposable**; they are **optically active** (rotate polarized light clockwise or counter-clockwise). **Most naturally occurring sugars are D-isomers** (biologically active).", "past": true, "trap": "Mirror image + not superimposable = enantiomers, not anomers or conformers.", "src": "p3"}, {"t": "**Epimers** differ at **only one** chiral center and are **not** mirror images: **glucose–galactose = C4 epimers**, **glucose–mannose = C2 epimers**.", "past": true, "trap": "Galactose is the C4 epimer of glucose; mannose is the C2 epimer.", "src": "p3"}]}, {"title": "Hemiacetal & hemiketal (cyclization)", "points": [{"t": "**Alcohol + aldehyde → hemiacetal**; **alcohol + ketone → hemiketal**.", "past": false, "trap": "", "src": "p4"}, {"t": "Fate of atoms: **hydroxyl oxygen → ether**; **carbonyl carbon → chiral carbon**; **carbonyl oxygen → hydroxyl (alcohol)**.", "past": true, "trap": "The carbonyl oxygen becomes OH; it is the hydroxyl oxygen that becomes the ether.", "src": "p4"}, {"t": "After cyclization the **carbonyl carbon** becomes a new chiral center = the **anomeric carbon** (with two configurations, **α and β**).", "past": true, "trap": "The anomeric carbon comes from the carbonyl carbon, not from a hydroxyl or carboxyl carbon.", "src": "p8"}, {"t": "Terminal group **above** the ring plane → **D-sugar**; **below** → **L-sugar**. Anomeric OH **same** side as terminal group → **β**; **opposite** side → **α**.", "past": false, "trap": "", "src": "p5"}]}, {"title": "Pyranoses & furanoses", "points": [{"t": "**Six-membered ring = pyranose** (resembles **pyran**, e.g. glucopyranose); **five-membered ring = furanose** (resembles **furan**, e.g. fructofuranose). The ring oxygen makes them **heterocyclic**.", "past": true, "trap": "", "src": "p6"}, {"t": "Pyranose and furanose are **the most stable rings**. In solution, **glucose and fructose are mostly pyranoses**, whereas **ribose is mostly furanose**.", "past": false, "trap": "In solution fructose is mostly pyranose, ribose mostly furanose.", "src": "p7"}]}, {"title": "Anomers", "points": [{"t": "**α-anomer**: the anomeric **OH points down** the ring plane, **opposite** the terminal CH2OH; **vice versa in β**. The anomeric carbon of glucose = **C1**; judge α/β by the **OH on C1**.", "past": false, "trap": "", "src": "p8"}, {"t": "Anomers **freely interconvert** in water. At equilibrium D-glucose = **β 63.6%**, **α 36.4%**, and **extremely tiny** amounts of the straight chain.", "past": false, "trap": "β (63.6%) is the larger share, not α (36.4%).", "src": "p8"}, {"t": "**β-anomer = more stable**, less energy, preferred shape; **α is less stable due to steric repulsion**.", "past": true, "trap": "", "src": "p8"}]}, {"title": "Haworth projection & conformers", "points": [{"t": "**Haworth projection** = a simple 3D way to represent **cyclic monosaccharides** (Fischer = linear form).", "past": true, "trap": "Haworth is for cyclic monosaccharides only, not amino acids.", "src": "p9"}, {"t": "Ring carbons are **tetrahedral** (angles ~**109.5°**), so sugar rings are **not planar**; pyranoses take **chair or boat** conformations (**conformers**).", "past": false, "trap": "", "src": "p9"}]}, {"title": "Sugar modification", "table": {"head": ["Derivative", "Change", "Example & use"], "rows": [["**Aldonic acid**", "**oxidation of aldehyde (C1)** → COOH", "**D-gluconic acid**; **calcium gluconate** IV"], ["**Uronic acid**", "**oxidation of OH at C6** → COOH", "**D-glucuronic acid**: building block of heteropolysaccharides"], ["**Alditol**", "**reduction** of carbonyl → alcohol", "**sorbitol** (sweetener), **glycerol**, ribitol"], ["**Deoxy sugar**", "OH replaced by **H**", "**deoxyribose** (DNA) from ribose (RNA)"], ["**Amino sugar**", "OH replaced by **amino / acetylated amino** group", "**glucosamine**, N-acetylglucosamine"]]}}, {"title": "Sugar derivatives — details", "points": [{"t": "**Gluconic acid** = oxidation of the **aldehyde group (C1)** of glucose; it no longer has an aldehyde group.", "past": true, "trap": "Oxidation of C1 aldehyde = gluconic; oxidation of C6 OH = glucuronic.", "src": "p10"}, {"t": "Drugs are injected as **gluconate** salts. **Calcium gluconate (IV)** = **cardioprotective** in patients with **high blood K⁺** (linked to **kidney failure**).", "past": false, "trap": "", "src": "p10"}, {"t": "**Sorbitol** = alditol from D-glucose: artificial sweetener with **lower calories** (slow, incomplete absorption). **Glycerol** comes from **D-glyceraldehyde**: backbone of **triglycerides**, moisturizer.", "past": true, "trap": "Glycerin (glycerol) is NOT a glucose derivative; sorbitol is.", "src": "p11"}, {"t": "**Deoxyribose** (DNA) is derived from **ribose** (RNA) by replacing an OH with H.", "past": true, "trap": "", "src": "p11"}, {"t": "**α-D-glucosamine** (rebuilds cartilage in **osteoarthritis & osteoporosis**) and **α-D-N-acetylglucosamine** are both derivatives of **α-D-glucose**.", "past": false, "trap": "Glyceraldehyde is a simple sugar, not a modified sugar.", "src": "p11"}]}]}, {"key": "L5", "title": "L5 - Carbohydrates 3", "section": "Mid", "sections": [{"title": "Disaccharides at a glance", "table": {"head": ["", "Maltose", "Lactose", "Sucrose"], "rows": [["Nickname", "**malt sugar**", "**milk sugar**", "**table sugar**"], ["Units", "**two α-glucose**", "**glucose + galactose**", "**glucose + fructose**"], ["Bond", "**α-1-4** O-glycosidic", "**β(1→4)** (galactose → glucose)", "**α-1,β-2**"], ["Reducing?", "**yes**", "**yes**", "**NO**"], ["Source", "starch hydrolysis; barley (malt beverage)", "milk, dairy", "**cane or beet**; preservative for dried fruits"]]}}, {"title": "Disaccharides & the glycosidic bond", "points": [{"t": "Disaccharide = two monosaccharides joined by a **glycosidic bond** (covalent): the **anomeric group** of a sugar condenses with an alcohol, releasing **water** (**condensation reaction**).", "past": true, "trap": "Bond formation = condensation; breaking = hydrolysis.", "src": "p3"}, {"t": "**O-glycosidic bond**: in maltose it links **C1 of unit 1 to C4 of unit 2** (**α-1-4**); the bridging O comes from the **C4 hydroxyl** of the second unit.", "past": false, "trap": "", "src": "p3"}, {"t": "**Maltose** = **two α-glucose**, released during **hydrolysis / degradation of starch**; **reducing sugar** (free anomeric carbon of the second unit).", "past": true, "trap": "", "src": "p3"}, {"t": "**Lactose** = **glucose + galactose**, found in **milk**; **reducing sugar** (free anomeric carbon of the second unit, glucose). Galactose is linked in the **β** form.", "past": true, "trap": "In lactose galactose is β only; it is the glucose end that can be α or β.", "src": "p4"}, {"t": "**Sucrose** = **glucose + fructose**, from **cane or beet**; **NOT reducing** because the anomeric carbon of the second residue is **involved in the glycosidic bond**. Ideal **preservative** for dried fruits.", "past": true, "trap": "Sucrose is the non-reducing one; maltose and lactose are reducing.", "src": "p5"}]}, {"title": "Lactose intolerance", "points": [{"t": "Cause = **deficiency of lactase enzyme** → lactose reaches the **colon intact** and is digested by **colon bacteria** → **nausea, bloating, abdominal cramps, diarrhea**.", "past": true, "trap": "Deficiency is of lactase (enzyme), not lactose or colon bacteria; no fever, constipation or headache.", "src": "p4"}, {"t": "**4 types**: **primary** (lactase declines **with age**) · **secondary** (**injury of small intestine**) · **congenital** (rare genetic, deficiency **at birth**) · **developmental** (**premature babies**).", "past": true, "trap": "From birth = congenital; premature babies = developmental.", "src": "p4"}]}, {"title": "Polysaccharides — classification", "points": [{"t": "Polysaccharides (**glycans**) = long chains joined by glycosidic linkages. Same monosaccharide = **homoglycans**; more than one type = **heteroglycans**. Can be **linear or branched**.", "past": true, "trap": "", "src": "p7"}, {"t": "**Storage**: **starch, glycogen**. **Structural**: **cellulose, chitin**.", "past": true, "trap": "", "src": "p7"}]}, {"title": "Storage polysaccharides", "table": {"head": ["", "Starch", "Glycogen"], "rows": [["Where", "**plants**", "**animals & humans**"], ["Make-up", "**amylose 20%** (water soluble) + **amylopectin 80%** (water insoluble)", "like amylopectin but **more highly branched**"], ["Branch points", "**every 24–30 units**", "**every 8–14 residues**"], ["Site / amount", "insoluble granules in plant cells", "**muscle up to 1–2%**, **liver up to 10%** of mass"]]}}, {"title": "Starch & glycogen — details", "points": [{"t": "Starch = **glucose** polymer. **Amylose** = linear, unbranched **α(1→4)**; **amylopectin** = α(1→4) chains with **α(1→6)** links at the branch points, branching every **24–30 units**.", "past": false, "trap": "Amylose is the soluble 20%; amylopectin is the insoluble 80%.", "src": "p7"}, {"t": "Due to the **α-linkage**, amylose and amylopectin form a **helically coiled** secondary structure (**hollow helix like a spiral spring**); the helix lets more glucose be stored.", "past": false, "trap": "", "src": "p7"}, {"t": "**Glycogen** = more highly branched than starch (every **8–14** residues) and also **helically coiled**, so it is **easily accessible to metabolic enzymes**.", "past": true, "trap": "Glycogen is more branched than starch (8–14 vs 24–30).", "src": "p8"}, {"t": "Starch and glycogen are **reducing sugars**: they have **one reducing end** (free anomeric **C1**); all branch ends are **non-reducing ends (C4)**.", "past": false, "trap": "One reducing end (C1); the many branch ends are non-reducing (C4).", "src": "p8"}]}, {"title": "Structural polysaccharides", "points": [{"t": "**Cellulose** = main structural component of **plant cell walls**: a **linear** polymer of D-glucose with **β-(1-4)** bonds, forming **very long straight chains** held together by **H-bonds**.", "past": true, "trap": "Starch = α-glucose polymer; cellulose = β-glucose polymer.", "src": "p9"}, {"t": "Humans cannot digest cellulose; **herbivores and termites** can, because they have **cellulases** (hydrolyze β-(1-4) bonds). Cellulose-rich food (vegetables) is used for **constipation**.", "past": true, "trap": "", "src": "p9"}, {"t": "**Chitin** = **exoskeletons** of invertebrates (insects, spiders) and **cell walls of fungi**: polymer of **N-acetyl-D-glucosamine** with **β-(1-4)** bonds; same as cellulose except **OH at C2 → acetyl amine**.", "past": true, "trap": "", "src": "p10"}]}, {"title": "Heteropolysaccharides", "points": [{"t": "Heteroglycans = two or more different monosaccharide units, mostly in **connective tissues** (cartilage, tendon, blood vessel walls).", "past": false, "trap": "", "src": "p11"}, {"t": "**Hyaluronic acid** = **major component of synovial (joint) fluid**: **lubricant and shock absorber**; in skin for tissue repair (**sodium hyaluronate** lotion for eczema). Linear polymer of **D-glucuronic acid + N-acetyl-D-glucosamine**.", "past": true, "trap": "", "src": "p11"}, {"t": "Sulfated heteroglycans: **chondroitin, dermatan, keratan sulfate and heparin**. **Chondroitin sulfate** = major in **cartilage** (**resistance to compression**); its loss causes **osteoarthritis**; supplement sold with **glucosamine**.", "past": false, "trap": "", "src": "p12"}, {"t": "**Dermatan sulfate** = mostly in the **skin**. **Keratan sulfate** = **cartilage and bone**, highly hydrated, a **cushion** absorbing mechanical shock. Both are linear polymers of a repeated disaccharide.", "past": false, "trap": "Dermatan = skin; keratan = cartilage and bone.", "src": "p13"}, {"t": "**Heparin** = **most highly charged** biological polymer; stored in **mast cell granules** (with **histamine** → role in **allergy**); **inhibits clotting** → injectable **anticoagulant** (postsurgical patients).", "past": true, "trap": "", "src": "p13"}]}]}, {"key": "L6", "title": "L6 - Amino Acid 1", "section": "Mid", "sections": [{"title": "Biological significance & structure", "points": [{"t": "Roles of amino acids: **N-containing** molecules · **building units of proteins** (protein role) · biologically active like **GABA** neurotransmitter · **precursors** like **thyroxine** · **energy source**.", "past": false, "trap": "", "src": "p3"}, {"t": "**More than 300** amino acids and derivatives exist, but only **20 are standard (canonical)**: encoded directly by **triplet codons** in the universal genetic code during **mRNA translation**.", "past": true, "trap": "", "src": "p3"}, {"t": "Structure: **-COOH + -NH2** on the **α-carbon (C2)**, plus H and a specific **R group**. Key elements: **C, N, O, H**.", "past": true, "trap": "", "src": "p3"}]}, {"title": "Standard vs proteinogenic", "table": {"head": ["Term", "Meaning", "Example"], "rows": [["**Standard (canonical)**", "has its **own triplet codon**", "the **20** default amino acids"], ["**Proteinogenic**", "added **during mRNA translation**", "**23** = 20 standard + 3 non-standard"], ["**Non-standard proteinogenic**", "no own codon, added by **unique mechanism**", "**N-formylmethionine, pyrrolysine, selenocysteine**"], ["**Non-proteinogenic, protein role**", "made by **post-translational modification**", "**hydroxyproline** (collagen)"], ["**Non-proteinogenic, non-protein role**", "never added to protein", "**GABA, carnitine**"]]}}, {"title": "Features of standard amino acids", "points": [{"t": "**Proteinogenic** = about the **time** of incorporation (during translation), **not** about having a protein role. Added by **post-translational modification** → **non-proteinogenic**.", "past": true, "trap": "Hydroxyproline has a protein role but is non-proteinogenic.", "src": "p5"}, {"t": "**Proteinogenic = 23**: 20 standard + 3 non-standard (**N-formylmethionine, pyrrolysine, selenocysteine**), all added by a **unique mechanism**.", "past": true, "trap": "These three are non-standard but proteinogenic.", "src": "p7"}, {"t": "**Selenocysteine** (found in humans): **UGA** (normally a **stop codon**) + a **stem-loop (SECIS)** at the 3′ end → read as Sec. Other details not required.", "past": true, "trap": "", "src": "p7"}, {"t": "**Standard ≠ essential**: standard means having a codon; essential amino acids are a different classification (next lecture).", "past": false, "trap": "Standard is not the same as essential.", "src": "p7"}, {"t": "Standard amino acids are **α-amino acids**: the primary **-NH2** is on the **α-carbon** (next to -COOH). **All standard are α, but not every α is standard** (e.g. selenocysteine).", "past": true, "trap": "", "src": "p6"}, {"t": "**Proline** = the **only** one with a **secondary amino group (-NH-)** (its side chain bends back and binds the N), but it is **still an α-amino acid**.", "past": true, "trap": "'Proline is the only standard amino acid that is not α' is FALSE.", "src": "p6"}]}, {"title": "Chirality, D/L and optical activity", "points": [{"t": "All standard amino acids are **chiral** with **L-configuration**, **except glycine** (R = H, **achiral**: no D/L, **not optically active**). Chiral carbon = attached to **4 different groups**.", "past": true, "trap": "'Glycine is dextrorotatory' is FALSE — glycine is achiral.", "src": "p8"}, {"t": "**Enantiomers** = stereoisomers that are **mirror images, not superimposable**, and **optically active**.", "past": true, "trap": "Enantiomers are NOT superimposable and are chiral, not achiral.", "src": "p9"}, {"t": "Fischer rule: **NH2 on the right of the α-carbon = D**; **on the left = L**. Most natural **sugars are D**; most natural (protein) **amino acids are L**.", "past": false, "trap": "", "src": "p9"}, {"t": "**D-amino acid** polypeptides are found in **bacterial cell walls** (to resist digestion by other organisms).", "past": false, "trap": "", "src": "p9"}, {"t": "Optical rotation is measured by a **polarimeter**: clockwise = **(+) / d (dextrorotatory)**; counter-clockwise = **(−) / l (levorotatory)**.", "past": true, "trap": "", "src": "p10"}, {"t": "**D/L (configuration) ≠ d/l or +/− (light rotation)**: a **D-isomer might be levorotatory**. **9 of 19** L-amino acids are dextrorotatory (which ones is not required).", "past": false, "trap": "D/L does not tell the direction of rotation; 19 because glycine is achiral.", "src": "p10"}, {"t": "**Racemic mixture** = **equal amounts** of both enantiomers → **net rotation is zero**.", "past": false, "trap": "", "src": "p10"}]}, {"title": "Classification of amino acids", "points": [{"t": "Three classifications: has a codon? → **standard / non-standard** · where is the NH2? → **α, β, γ, δ** · added during translation? → **proteinogenic / non-proteinogenic**.", "past": false, "trap": "", "src": "p13"}, {"t": "Carbon naming: **C1** = carboxyl carbon · **C2 = α** (next to COOH) · **C3 = β** · **C4 = γ**. **α-alanine is standard**, **β-alanine is non-standard**.", "past": true, "trap": "", "src": "p12"}, {"t": "**GABA = γ-aminobutyric acid**: non-standard, non-proteinogenic, **non-protein role** (inhibitory neurotransmitter). **Carnitine**: **lipid transport and fat metabolism**.", "past": true, "trap": "", "src": "p13"}]}, {"title": "Categories of standard amino acids (R-group polarity)", "table": {"head": ["Category", "Members", "Feature to recognise"], "rows": [["**Non-polar (9)**", "Gly, Ala, Val, Leu, Ile, Met · **Phe, Trp** · **Pro**", "6 aliphatic, 2 aromatic, 1 cyclic"], ["**Charged polar (5)**", "basic (+): **Lys, Arg, His** · acidic (−): **Asp, Glu**", "Lys ends with amino group; Arg 3 N; His 5-ring with 2 N"], ["**Uncharged polar (6)**", "**Ser, Thr** · **Asn, Gln** · **Tyr** · **Cys**", "OH · amide · phenolic · free SH"]]}}, {"title": "R groups — what to recognise", "points": [{"t": "**Glycine** = simplest side chain (**H**). **Methionine** = **thioether** (S between two carbons). **Phenylalanine** = **phenyl**; **tryptophan** = **indole**; **proline** = **cyclic** side chain.", "past": true, "trap": "Thioether = methionine; free SH = cysteine.", "src": "p15"}, {"t": "**Aspartate and glutamate** = ionized (negative) forms of aspartic and glutamic acids; **Asp** has one CH2 before the extra COOH, **Glu** has two.", "past": true, "trap": "", "src": "p15"}, {"t": "**Asparagine and glutamine** = amide derivatives of **aspartic and glutamic acids respectively** (OH replaced by NH2).", "past": false, "trap": "Order matters: asparagine ← aspartic, glutamine ← glutamic; reversed is wrong.", "src": "p15"}, {"t": "**Tyrosine** = **aromatic with a phenolic group**, yet **polar uncharged**. OH-containing: **serine, threonine, tyrosine**. Aromatic: **Phe, Tyr, Trp**. Sulphur: **cysteine, cystine, methionine**.", "past": false, "trap": "Phenyl = Phe (non-polar); phenolic = Tyr (polar uncharged).", "src": "p18"}, {"t": "**Cysteine** has a **free sulfhydryl (-SH)**; two cysteines form a **disulfide bond (-S-S-)** after oxidation and loss of H atoms → **cystine** (oxidized dimer); disulfide bridges stabilise protein shape.", "past": true, "trap": "", "src": "p15"}]}]}, {"key": "L7", "title": "L7 - Amino Acid 2", "section": "Mid", "sections": [{"title": "Disulfide bridge", "points": [{"t": "A **disulfide bond** is a **covalent** link between the **SH groups of two cysteine** residues, formed by **oxidation** (loss of 2 H); the product is **cystine**.", "past": true, "trap": "Cysteine = one amino acid with a free SH (reduced); cystine = two cysteines joined by S–S (oxidized dimer).", "src": "p3"}, {"t": "The two cysteines may be **far apart** in the sequence or on **two chains**; **folding** brings them close. **Intramolecular** = same chain · **intermolecular** = two different chains.", "past": true, "trap": "\"It occurs only intramolecularly\" is FALSE; it can be intra- or intermolecular.", "src": "p4"}, {"t": "Only **cysteine** forms S–S bonds; **methionine** has sulfur but **no free SH**. The bridge is a main bond for protein **stability and shape**; losing a cysteine can inactivate the protein.", "past": true, "trap": "", "src": "p4"}]}, {"title": "Nutritional classification", "table": {"head": ["", "Essential (8)", "Non-essential (9)", "Conditionally essential (3)"], "rows": [["Body synthesis", "**cannot** be made → **diet**", "**can** be synthesized", "made in **insufficient** amounts"], ["Members", "Val, Ile, Leu, Lys, Met, **Phe**, **Thr**, Trp", "Gly, Ala, Ser, Cys, Asp, Glu, Asn, Gln, Pro", "**His, Arg, Tyr**"], ["Shortcut", "nonpolar except Gly/Ala/Pro + Lys + Thr", "Gly, Ala, Pro + Asp, Glu + Asn, Gln, Ser, Cys", "His/Arg: growth · Tyr: PKU"]]}}, {"title": "Essential, non-essential, conditionally essential", "points": [{"t": "The 20 standard amino acids = **8 essential + 9 non-essential + 3 conditionally essential**. **Standard ≠ essential**: standard = has a codon; essential = **cannot be made**, must come from **diet**.", "past": true, "trap": "", "src": "p7"}, {"t": "**Conditionally essential** = synthesized in **insufficient amounts** (requirement higher than production): **histidine, arginine, tyrosine**; essential only in certain cases.", "past": true, "trap": "", "src": "p6"}, {"t": "**Arginine and histidine** are **growth-promoting** → essential in **growing children, pregnancy and lactation**.", "past": true, "trap": "Leucine, lysine, isoleucine are always essential, never \"conditionally\"; tyrosine is not conditional in pregnancy.", "src": "p6"}, {"t": "**Tyrosine** is made from **phenylalanine** (essential); if the converting enzyme is deficient (**PKU**), tyrosine **must be supplied by diet**.", "past": true, "trap": "Phenylalanine is the essential precursor; tyrosine is the conditionally essential product.", "src": "p6"}, {"t": "**PKU** = **autosomal recessive** inborn error: **phenylalanine accumulates**, toxic to the brain → **intellectual disability and mental retardation**. Detected by **newborn screening** (heel blood).", "past": true, "trap": "Mental disability comes from accumulated phenylalanine, NOT tyrosine.", "src": "p6"}]}, {"title": "Amino acid derivatives", "points": [{"t": "**Non-standard / non-proteinogenic** amino acids are **derivatives of standard** ones: either **not found in proteins** (**carnitine, GABA**) or **added after translation** with a protein role (**hydroxyproline, carboxyglutamate**).", "past": true, "trap": "In a list with carnitine, GABA and hydroxyproline, the standard one is the ordinary amino acid (e.g. phenylalanine).", "src": "p8"}, {"t": "Post-translational modifications: **carboxylation of glutamate** in **blood-clotting** proteins → better **Ca²⁺ binding**; **hydroxylation of proline** in **collagen** → maintains **connective tissue**.", "past": false, "trap": "", "src": "p8"}, {"t": "**Proteinogenic non-standard** amino acids are also derivatives: Cys → **selenocysteine** · Lys → **pyrrolysine** · Met → **N-formylmethionine**. They are **proteinogenic**, added by a **unique mechanism**.", "past": true, "trap": "Lysine, alanine, glutamate and selenocysteine share \"proteinogenic\", not \"standard\".", "src": "p10"}, {"t": "**Tryptophan → serotonin** · **Tyrosine → thyroxine + catecholamines** (dopamine, adrenaline, noradrenaline) · **Histidine → histamine** by **decarboxylation** (allergy) · **Glutamate → GABA**, the **major inhibitory** brain neurotransmitter.", "past": true, "trap": "Serotonin comes from tryptophan, not tyrosine; adrenaline comes from tyrosine.", "src": "p8"}]}, {"title": "Ionization, zwitterion and pI", "points": [{"t": "Amino acids are **amphoteric (ampholytes)**: acidic **–COOH** and basic **–NH₂**. Acid = proton **donor**, base = proton **acceptor**; the ionization state **depends on pH**.", "past": false, "trap": "", "src": "p11"}, {"t": "**Very low pH** → fully protonated → **+1, cation** · **intermediate pH** → both ionized → **0, zwitterion** · **very high pH** → deprotonated → **−1, anion**.", "past": true, "trap": "", "src": "p11"}, {"t": "**Zwitterion** = a **form** carrying **NH₃⁺ and COO⁻** → net charge **0**. **Isoelectric point (pI)** = the **pH value** with no net charge; at pI the zwitterion is **dominant**.", "past": true, "trap": "\"The neutral form\" = zwitterion; \"the pH at which the molecule is neutral\" = isoelectric point.", "src": "p12"}, {"t": "**pK** = the pH at which **half** the group is dissociated; **pI = ½ (pK1 + pK2)**. **Glycine**, the simplest amino acid: pK1 = **2.34**, pK2 = **9.6**, pI = **5.97**.", "past": true, "trap": "", "src": "p13"}, {"t": "Shortcut: **pH < pI → positive (cation)** · **pH > pI → negative (anion)**. At **pH = pK1** → 50% cation : 50% zwitterion; at **pH = pK2** → 50% zwitterion : 50% anion.", "past": true, "trap": "At pH = pK the mixture is 50:50; the zwitterion dominates only at pI.", "src": "p14"}, {"t": "Rising pH: **COOH loses its H⁺ first** (pK1), then **NH₃⁺** (pK2). Wording: COOH protonated = **non-ionized**, NH₃⁺ protonated = **ionized**. The pK table is **not required**.", "past": false, "trap": "", "src": "p14"}]}]}, {"key": "L8", "title": "L8 - Protein 1", "section": "Mid", "sections": [{"title": "Peptide bond", "points": [{"t": "A **peptide bond** joins two amino acids: the **–COOH (gives OH)** of one reacts with the **–NH₂ (gives H)** of the other, **releasing H₂O** = **dehydration (condensation)** reaction.", "past": true, "trap": "", "src": "p4"}, {"t": "The resulting **CO–NH** bond = peptide bond and the molecule is an **amide**. Dipeptide = 2 aa · tripeptide = **3 aa joined by 2 peptide bonds** · many = **polypeptide**.", "past": true, "trap": "A tripeptide has 3 amino acids but only 2 peptide bonds; the link is an amide, not an ester.", "src": "p4"}, {"t": "A sequence is read from the **amino (N)-terminal** to the **carboxy (C)-terminal** end. A polypeptide = a **constant backbone** + **variable side chains (R)**.", "past": false, "trap": "", "src": "p4"}, {"t": "Peptide bond: **covalent**, **strong**, **uncharged but polar**, **partial double-bond** character (shorter than a single bond) → **no rotation, rigid and planar**, and **trans** (cis has **steric clashes**).", "past": true, "trap": "The peptide bond is trans, not cis.", "src": "p5"}]}, {"title": "Proteins and their functions", "points": [{"t": "Proteins = **one or more polypeptide chains** of hundreds of amino acids; each has a **unique sequence** specified by the **nucleotide sequence of its gene**.", "past": false, "trap": "", "src": "p5"}, {"t": "Functions: **immune protection** (antibodies) · **catalysis** (enzymes) · **transport and storage** (haemoglobin) · **mechanical support** (cytoskeleton) · **movement** (actin, myosin) · **receptors**.", "past": true, "trap": "\"Contains genetic material\" is the EXCEPT option; it is not a protein function.", "src": "p6"}, {"t": "Structure–function: a protein's **function depends directly on its 3D structure**; its many **functional groups** explain its broad range of functions; **rigid** units act as structural elements.", "past": false, "trap": "", "src": "p6"}]}, {"title": "Levels of structure and primary structure", "points": [{"t": "Four levels: **primary** (aa sequence) → **secondary** (α-helix, β-sheet, turns) → **tertiary** (3D, assembly of secondary) → **quaternary** (**more than one chain**). Simplest = primary; most complex = quaternary.", "past": true, "trap": "", "src": "p7"}, {"t": "**Primary structure** = the **sequence** of residues, reported **N → C**, determined by the **genetic code** (DNA → mRNA by **transcription**, mRNA → protein by **translation**).", "past": false, "trap": "", "src": "p7"}, {"t": "**Start (initiation) codon = AUG**; **stop codons = UAA, UAG, UGA**. Only these are required, not the rest of the codon table.", "past": true, "trap": "", "src": "p7"}]}, {"title": "α-helix vs β-sheet", "table": {"head": ["", "α-helix", "β-sheet"], "rows": [["Shape", "**right-handed** coil (spring)", "extended strands, **pleated** sheet"], ["H-bonds", "N–H to C=O **4 residues earlier** (same chain)", "between **adjacent strands** (side by side)"], ["Numbers", "**3.6 residues per turn**", "strand **3–10 aa** long"], ["Side chains", "point **outward**", "alternate **up and down**"], ["Frequency", "**most common**", "**less common** than α-helix"], ["Favoured by", "Met, **Ala**, Leu, uncharged Glu, Lys", "large **aromatic**: Trp, Tyr, Phe"]]}}, {"title": "Secondary structure", "points": [{"t": "**Secondary structure** = local, regular structure formed mainly by **H-bonds between backbone atoms**. Major stable types: **α-helix and β-sheet**, located in the **core**; **loops** lie in **outer regions**.", "past": true, "trap": "Secondary-structure H-bonds are between backbone atoms, not side chains.", "src": "p8"}, {"t": "**α-helix**: **right-handed** coil; each backbone **N–H** H-bonds the **C=O four residues earlier**; one turn = **3.6 amino acids**. The left-handed α-helix is **rare**.", "past": true, "trap": "3.6 residues per turn, H-bond 4 residues apart — do not swap; the α-helix is right-handed.", "src": "p8"}, {"t": "In the α-helix the **backbone forms the inner part** of the coil and the **side chains extend outward**.", "past": true, "trap": "Side chains point outward, not up and down the helix axis.", "src": "p9"}, {"t": "High helix-forming propensity: **methionine, alanine, leucine, uncharged glutamate, lysine**. **Proline and glycine** = poor → \"**helix breakers**\", yet commonly found in **turns**.", "past": true, "trap": "Glycine and proline break helices but are found in turns; alanine is a strong helix former.", "src": "p9"}, {"t": "**Proline** breaks or kinks a helix: it has **no amide hydrogen** to donate and its side chain clashes sterically → **~30° bend**. **Many charged** or **bulky** residues (tryptophan) also disrupt it.", "past": false, "trap": "Uncharged glutamate favours the helix; large numbers of charged glutamate disrupt it.", "src": "p9"}, {"t": "**β-sheet**: **β-strands** (3–10 aa, almost **fully extended**) joined **side by side** by backbone H-bonds (N–H of one strand to C=O of the adjacent strand).", "past": true, "trap": "", "src": "p10"}, {"t": "β-sheets are **parallel** (adjacent strands run in the **same direction**) or **antiparallel** (**opposite** directions).", "past": true, "trap": "", "src": "p10"}]}, {"title": "Turns, β-bends and motifs", "points": [{"t": "A **turn** reverses the chain's direction: Cα atoms of two residues separated by **1–5 peptide bonds** come **< 7 Å** apart without forming a helix or sheet.", "past": false, "trap": "", "src": "p11"}, {"t": "Tight turns by bonds between end residues: **α = 4** · **β = 3 (most common, β-bend)** · **γ = 2** · **δ = 1** · **π = 5**.", "past": true, "trap": "Alpha-turn = 4 bonds and delta-turn = 1 bond; α-β-γ-δ count down 4-3-2-1, π = 5.", "src": "p11"}, {"t": "**β-bends**: usually **4 amino acids**, stabilized by H-bonds and **< 7 Å** between Cα of residues 1 and 4; often contain **proline** (kink) and **glycine** (smallest R group).", "past": false, "trap": "", "src": "p11"}, {"t": "**Super-secondary structures (motifs)** = α-helices and β-structures **connected by loops**, stabilized like the tertiary level: **α-α, β-β, β-α-β**, or complex ones like the **β-barrel**.", "past": true, "trap": "\"Alpha sheet\" is not a motif.", "src": "p11"}]}]}, {"key": "L9", "title": "L9 - Protein 2", "section": "Mid", "sections": [{"title": "Tertiary structure", "points": [{"t": "**Tertiary structure** = the protein's **3D**, final specific shape, determined by **bonding between side chains**; these can be **stronger** than the backbone H-bonds of the helix and cause folds, bends and loops.", "past": true, "trap": "H-bonds between side chains in one chain → tertiary; H-bonds between backbone atoms → secondary.", "src": "p3"}, {"t": "Four side-chain interactions stabilize it: **hydrogen bonds, salt bridges, disulfide bonds, non-polar hydrophobic interactions**.", "past": true, "trap": "Peptide bonds do NOT stabilize tertiary structure; they make the primary structure.", "src": "p3"}, {"t": "**Disulfide bonds** form by **oxidation of cysteine SH** groups; these **strong covalent** bonds hold different loops of a **single chain** together.", "past": true, "trap": "Only cysteine + cysteine form it, and it can be intra- or intermolecular (insulin's two chains); \"only intramolecular\" is false.", "src": "p3"}, {"t": "Side-chain **H-bonds**: two alcohols (**ser, thr, tyr**) · alcohol + acid (**asp + tyr**) · two acids (**asp + glu**) · **ser + lys** · **ser + asn**. Prion: **tyr 128 – asp 178**.", "past": false, "trap": "", "src": "p4"}, {"t": "**Salt bridge** = neutralization of an **acid** with an **amine** side chain → **ionic** bond between **positive ammonium** and **negative acid** groups; e.g. **glutamate + lysine** (prion Glu 200 – Lys 204).", "past": true, "trap": "Glutamate + lysine = salt bridge; lysine + arginine are both positive, so no salt bridge.", "src": "p4"}, {"t": "**Hydrophobic interactions** (\"**likes dissolve likes**\"): alkyl groups of **ala, val, leu, ile**; aromatic rings of **phe, tyr stack**. Result: **non-polar side chains inside**, polar groups outside globular proteins.", "past": false, "trap": "", "src": "p5"}]}, {"title": "Domains", "points": [{"t": "A **domain** = a section of protein **sufficient for a particular task** (e.g. binding a ligand), **structurally independent**, an **elementary unit** of structure. Small proteins may have **one domain**; pyruvate kinase shows **three**.", "past": false, "trap": "", "src": "p6"}, {"t": "Domain functions: bind a **small ligand** · **span the plasma membrane** · contain the **catalytic site** · **DNA binding** (transcription factors) · a surface to **bind another protein**.", "past": false, "trap": "", "src": "p6"}]}, {"title": "Quaternary structure", "points": [{"t": "**Quaternary** = assembly of **several polypeptides** into one functional protein, held **only by non-covalent** bonds (H-bonds, ionic, hydrophobic). Two subunits = dimeric, three = trimeric, several = multimeric. **Not all proteins** have it.", "past": true, "trap": "Quaternary needs more than one chain AND no covalent links between the chains.", "src": "p7"}, {"t": "**Myoglobin** (one chain + heme) → **no quaternary**. **Insulin** (two chains linked by **disulfide**) → **no quaternary**. **Haemoglobin** (4 chains, 4 hemes, non-covalent) = the **typical** quaternary protein.", "past": true, "trap": "Insulin has two chains but no quaternary structure, because its chains are covalently (disulfide) linked.", "src": "p7"}, {"t": "Subunits may work **independently** or **cooperatively**: in haemoglobin, O₂ binding to one subunit **increases the affinity** of the other subunits.", "past": false, "trap": "", "src": "p7"}]}, {"title": "Protein folding and chaperones", "points": [{"t": "**Folding** = the process by which a polypeptide reaches its **functional 3D structure** from a **random coil**. Most proteins fold **spontaneously**; the **amino acid sequence contains all the information** needed.", "past": true, "trap": "The 3D structure is determined by the amino acid sequence, not by chaperones or peptide bonds.", "src": "p8"}, {"t": "Folding often begins **co-translationally**: the **N-terminus** starts folding while the **C-terminal** part is still being made on the ribosome.", "past": false, "trap": "", "src": "p8"}, {"t": "Folding depends on **solvent, salt concentration, temperature, and molecular chaperones**. Failure gives **inactive, usually toxic** proteins; **amyloid fibrils** of misfolded proteins cause **neurodegenerative** diseases.", "past": true, "trap": "", "src": "p8"}, {"t": "**Chaperones assist folding**: they prevent **misfolding and aggregation** (also after heat); ring-shaped chaperones bind partly folded chains in a **central cavity** with **ATP-dependent** cycles, acting on exposed **hydrophobic surfaces**.", "past": true, "trap": "Chaperones assist folding; they do not degrade proteins and are not denaturing agents.", "src": "p9"}]}, {"title": "Denaturing agents", "table": {"head": ["Class", "Examples"], "rows": [["Acids", "acetic acid, **trichloroacetic acid 12%**"], ["Solvents", "**ethanol**, methanol"], ["Cross-linking reagents", "**formaldehyde**, glutaraldehyde"], ["Chaotropic agents", "**urea 6–8 M**, **guanidinium chloride 6 M**"], ["Disulfide bond reducers", "**2-mercaptoethanol**, **DTT**"]]}}, {"title": "Denaturation and renaturation", "points": [{"t": "**Denaturation** = loss of **3D structure** enough to cause **loss of function**, by breaking **non-covalent** bonds; may cause loss of solubility or **communal aggregation** (hydrophobic proteins cluster to reduce water exposure).", "past": true, "trap": "", "src": "p10"}, {"t": "Quaternary → subunits **dissociate** · tertiary → side-chain interactions disrupted (incl. **disulfide**) · secondary → helices and sheets lost → **random coil** · **primary (peptide bonds) is NOT disrupted**.", "past": true, "trap": "The primary structure is the level least affected by pH change or denaturation.", "src": "p10"}, {"t": "**Renaturation** = return of a denatured protein to its **original structure and activity**; the **primary structure stays the same**, proving the sequence holds all folding information.", "past": true, "trap": "", "src": "p11"}, {"t": "**Refolding** starts by **removing the denaturant**, at **low protein concentration** (**10–100 mg/ml**) to slow aggregation; important variables: **buffer composition (pH, ionic strength)** and **temperature**.", "past": false, "trap": "", "src": "p12"}, {"t": "Refolding methods: **dialysis** (most used; denaturant falls slowly) · **slow dilution** (step-wise buffer or pump) · **chromatography**: size exclusion (gel filtration), ion exchange, affinity.", "past": false, "trap": "", "src": "p12"}, {"t": "**Size exclusion (gel filtration)** separates by **size**: the **largest molecule comes out first**, the smallest last. **Ion exchange** separates by **charge**; **affinity** by specific binding to the resin.", "past": false, "trap": "In gel filtration the biggest molecule elutes first, not the smallest.", "src": "p12"}]}]}, {"key": "L10", "title": "L10 - Protein 3", "section": "Mid", "sections": [{"title": "Classification of proteins", "table": {"head": ["", "Fibrous", "Globular", "Membrane"], "rows": [["Shape", "rod-like, extended", "compact, sphere-like", "embedded in the lipid bilayer"], ["Water", "**insoluble**", "**soluble**", "insoluble (many hydrophobic aa)"], ["Secondary structure", "simple, **one type only**", "complex mix (α, β, loops)", "—"], ["Role", "**structural**", "**metabolic** (enzymes, transport)", "transport, receptors"], ["Example", "**collagen**, keratin, elastin, fibroin", "**myoglobin**", "**rhodopsin**"]]}}, {"title": "Collagen", "points": [{"t": "Collagen = the **most abundant protein in the body** (**25–35%** of whole-body protein) and the main structural protein of **connective tissue** (skin, tendons, cartilage, bones).", "past": false, "trap": "", "src": "p4"}, {"t": "Its **tensile strength** comes from: the **triple helix**, the assembly of **tropocollagen** subunits into fibres, and **chemical cross-linking**.", "past": false, "trap": "", "src": "p4"}, {"t": "**Three α-chains** twist around each other like a rope = **triple helix (tropocollagen)**, held by **hydrogen bonds**. \"α-chain\" is only the name of each chain; it is **not** an α-helix.", "past": true, "trap": "\"α-chain\" is only a name; collagen chains are not α-helices.", "src": "p5"}, {"t": "Collagen helix = **left-handed**, **3.3 residues per turn**, more extended. The α-helix = **right-handed**, 3.6 residues per turn.", "past": false, "trap": "Collagen is left-handed (3.3/turn); the α-helix is right-handed (3.6/turn).", "src": "p5"}, {"t": "At least **19** collagen types. **Type I = the most common**: **two α1 + one α2** chains. Types II and III = **three identical** chains.", "past": false, "trap": "Type I = two α1 + one α2 (not three identical); types II and III = three identical.", "src": "p5"}, {"t": "Composition: nearly **1 residue in 3 is glycine**; **proline** is unusually high (its ring makes \"kinks\" that help the helix); modified amino acids **4-hydroxyproline, 3-hydroxyproline, 5-hydroxylysine**.", "past": true, "trap": "Glycine is about 1 in 3 residues; proline helps the collagen helix even though it breaks the α-helix.", "src": "p6"}, {"t": "Hierarchy: amino acids → **tropocollagen** → collagen **fibrils** → collagen **fibers**.", "past": false, "trap": "", "src": "p6"}, {"t": "**Ehlers-Danlos syndrome** = inherited defect in collagen synthesis (**type I or III**): fragile skin and **loose joints**; no cure, supportive treatment.", "past": true, "trap": "", "src": "p7"}, {"t": "**Collagenopathy type II and XI** (cartilage): mutations in **COL2A1, COL11A1, COL11A2** → abnormal bone growth, short stature, early arthritis, vision and hearing problems, cleft palate.", "past": false, "trap": "", "src": "p7"}]}, {"title": "Keratin", "points": [{"t": "Keratin = tough, **water-insoluble**; main protein of **hair, nails**, outer skin. Two groups: **α-keratin (α-helix)** and **β-keratin (β-sheet)**.", "past": false, "trap": "", "src": "p8"}, {"t": "**α-keratin** = a **dimer of two α-helices**, **rich in cysteine**: **disulphide bridges** join the helices. **The more disulphides, the stronger** (harder) the keratin.", "past": false, "trap": "More disulphide bonds = harder keratin.", "src": "p9"}]}, {"title": "Motor proteins (muscle)", "points": [{"t": "**Sarcomere** = the **smallest functional unit** of muscle: **myosin (thick)** and **actin (thin)** filaments. Myosin heads bind actin and pull it to the centre → the sarcomere **shortens**.", "past": false, "trap": "", "src": "p9"}, {"t": "**Myosin** = a **hexamer**: **2 heavy chains (220 kDa) + 4 light chains (~20 kDa)**. Heavy chain = **3 domains: S1, S2, LMM**. The **S1 head** holds the **actin-binding** and **ATPase** sites.", "past": true, "trap": "Myosin is a hexamer (2 heavy + 4 light), not a tetramer; the heavy chain has 3 domains, not 4.", "src": "p10"}, {"t": "**Actin**: **42 kDa**, **375 amino acids**. **G-actin** (globular monomer) polymerises into **F-actin** (filament), a **two-strand helix**.", "past": true, "trap": "", "src": "p11"}, {"t": "**Tropomyosin** = a **right-handed** coiled **dimer** (284 aa per chain) lying **head to tail** along actin; **one Tm spans 7 actin monomers**.", "past": true, "trap": "", "src": "p11"}, {"t": "**Troponin** = **3 subunits**: **TnC = calcium sensor** (18 kDa) · **TnI = inhibitory** (24 kDa) · **TnT = binds tropomyosin** (37 kDa).", "past": true, "trap": "Troponin has 3 subunits (not 5); the calcium sensor is TnC, not TnI.", "src": "p12"}]}, {"title": "Globular proteins & myoglobin", "points": [{"t": "Globular (sphero-) proteins: **polar residues outside, hydrophobic inside** → soluble. Classes by secondary structure: **all α = myoglobin** · **all β = tenascin** · **α/β = triose phosphate isomerase** · **α+β = ribonuclease A**.", "past": true, "trap": "", "src": "p13"}, {"t": "**Myoglobin stores O₂ in muscle**; **haemoglobin transports O₂ in blood**.", "past": true, "trap": "", "src": "p14"}, {"t": "Myoglobin: **one chain of 153 aa** + one heme; **75% α-helix in 8 regions (helices A–H)**; interior almost all non-polar; **heme lies between helices E and F**. No quaternary structure.", "past": true, "trap": "75% α-helix in 8 regions (A–H); heme sits between E and F; myoglobin has no quaternary structure.", "src": "p14"}, {"t": "Heme = **porphyrin** (4 pyrrole rings joined by methylene bridges) + **ferrous iron (Fe²⁺)**. The **hydrophobic interior prevents iron oxidation**.", "past": false, "trap": "", "src": "p15"}, {"t": "Iron has **6 ligands**: **4 pyrrole nitrogens** · 5th = **His 93 (proximal histidine, His F8)** · 6th = **O₂**.", "past": false, "trap": "", "src": "p15"}]}]}, {"key": "L11", "title": "L11 - Protein 4", "section": "Mid", "sections": [{"title": "Heme in myoglobin (recap)", "points": [{"t": "Heme **Fe²⁺** has **6 ligands**: **4 pyrrole N** · **His 93 (proximal His, F8)** · **O₂**. **Mb binds only one O₂**, at a **sterically hindered** site that stabilises O₂ on the ferrous iron.", "past": false, "trap": "", "src": "p3"}]}, {"title": "Hemoglobin structure", "points": [{"t": "Hb = **O₂ transporter in erythrocytes**: **2 α subunits (141 aa each) + 2 β subunits (146 aa each)**; **each subunit has one heme** (4 hemes per Hb). It binds O₂ **reversibly**, like Mb.", "past": false, "trap": "", "src": "p4"}, {"t": "**β chain (146)** is shorter than Mb (153) because its **H helix is shorter**. **α chain (141)** also has a shortened H helix **and lacks the D helix**.", "past": false, "trap": "The α chain (not β) lacks the D helix; 141 = α, 146 = β, 153 = Mb.", "src": "p4"}, {"t": "Both α and β chains are **strikingly similar in structure to Mb** (same fold, different chain lengths).", "past": true, "trap": "Past exam answer: Mb and Hb subunits are similar in tertiary structure but different in primary structure.", "src": "p4"}]}, {"title": "Binding behaviour, T and R states", "points": [{"t": "**Hb has lower O₂ affinity than Mb.** O₂ on the 1st subunit enhances the 2nd and 3rd, then the 4th = **positive cooperative binding**. On oxygenation **Fe moves into the porphyrin plane**.", "past": true, "trap": "Hb affinity is lower than Mb; Fe moves INTO the plane, not out of it.", "src": "p4"}, {"t": "Oxygenation changes the quaternary structure from **T (tense) = low O₂ affinity** to **R (relaxed) = high O₂ affinity**; **salt bridges** between subunits in T **break progressively** as O₂ is added.", "past": true, "trap": "Oxygenation is T → R (never R → T); T is the low-affinity state.", "src": "p5"}, {"t": "In **T state** only **α-chain hemes** take O₂ (**β hemes sterically blocked**). O₂ pulls **Fe²⁺ into the plane**, moving proximal His and **F helix** → **salt bridges rupture** → **T → R** everywhere.", "past": false, "trap": "", "src": "p6"}]}, {"title": "Oxygen release and the Bohr effect", "points": [{"t": "O₂ binding depends on **pO₂, pH and pCO₂**. **Release** is enhanced by **low pH**, **high pCO₂** and **low pO₂** (CO₂ + H₂O → H₂CO₃ → **HCO₃⁻ + H⁺**, via **carbonic anhydrase**).", "past": false, "trap": "", "src": "p5, p7"}, {"t": "**Bohr effect** = the **decrease in Hb's O₂ affinity** caused by binding of **CO₂ and acid (H⁺)**, which changes Hb conformation and releases O₂.", "past": false, "trap": "", "src": "p7"}]}, {"title": "Hemoglobin vs myoglobin", "table": {"head": ["", "Myoglobin", "Hemoglobin"], "rows": [["Location", "**muscle**", "**RBCs**"], ["Role", "**reservoir** (store) of O₂", "**carrier** of O₂"], ["Quaternary structure", "**no**", "**yes** (4 subunits)"], ["CO₂", "**can't carry** CO₂", "**carries** CO₂"], ["Cooperativity", "**none**", "**shows cooperativity**"], ["O₂ affinity", "**higher**", "**lower**"]]}}, {"title": "Myoglobin traps", "points": [{"t": "Common EXCEPT: **Mb shows no cooperativity** and has **no quaternary structure**; it **stores** O₂ (Hb transports).", "past": true, "trap": "\"Myoglobin has cooperativity\" or \"Myoglobin transports O₂\" are the false options.", "src": "p7"}]}, {"title": "Fibrous vs globular & membrane proteins", "points": [{"t": "**Globular** = compact, **water-soluble**, mixed α-helix/β-sheet/loops, metabolic roles (enzymes, transport, immune, hormones). **Fibrous** = extended, **insoluble**, one secondary-structure type, structural (tendons, bones, muscle, **ligaments**, hair, skin).", "past": false, "trap": "", "src": "p8"}, {"t": "Membrane proteins: **integral** (permanently bound) · **peripheral** (temporarily, to bilayer **or integral proteins**) · **lipid-anchored** (lipidated amino acids). Transmembrane classes: **α-helices and β-sheets**; protruding part usually **hydrophilic**.", "past": false, "trap": "", "src": "p8, p9"}, {"t": "**Six functions**: transport · enzymatic activity · signal transduction · cell-cell recognition · intercellular joining · attachment to cytoskeleton and **ECM** (control of fluidity and transcription are not listed).", "past": false, "trap": "", "src": "p9"}, {"t": "**Cytochrome c oxidase** = the **primary O₂-utilisation enzyme** of aerobic organisms; it **donates electrons to O₂** in the electron transport chain (membrane-protein example).", "past": false, "trap": "", "src": "p9"}]}, {"title": "Clinical examples on protein abnormalities", "points": [{"t": "**Sickle cell anemia** = **autosomal recessive**; **point mutation** in the **hemoglobin β gene (HBB)** on **chromosome 11p15.5** → abnormal **HbS**.", "past": true, "trap": "β gene (not α), chromosome 11 (not 12), recessive (not dominant).", "src": "p10"}, {"t": "Sequence: HbA ...Pro-**Glu**-Glu-Lys → HbS ...Pro-**Val**-Glu-Lys: **Glu replaced by Val** in the β chain. At **low O₂ or high Hb concentration**, HbS **clusters**, sickles RBCs and blocks small vessels.", "past": true, "trap": "Normal Glu is replaced by Val (HbS has Val, HbA has Glu).", "src": "p10"}, {"t": "Symptoms: **cough, fever, headache**, **yellow tinge in whites of eyes**, pale mucous membranes, **enlarged heart**, well developed physically. Smear: irregular, elongated, **sickle- and crescent-shaped** cells.", "past": true, "trap": "", "src": "p10"}, {"t": "**Alzheimer disease**: **4th leading cause of death** in adults, **twice as common in women**; genes on **chromosomes 1, 14, 19, 21**. **Plaques** = extracellular **amyloid** in gray matter; **tangles** = **hyperphosphorylated tau**.", "past": true, "trap": "", "src": "p11"}, {"t": "AD misfolded proteins = **β-amyloid** and a **cleaved product of tau**. Hypotheses: **cholinergic** (oldest, reduced acetylcholine) and **amyloid** (β-amyloid = fundamental cause). Hallmarks: plaques, tangles, **loss of connections** between cells.", "past": true, "trap": "It is β-amyloid, not α-amyloid; AD is not transmitted by eating (that is mad cow).", "src": "p11"}, {"t": "**Mad cow disease = bovine spongiform encephalopathy (BSE)**: **fatal neurodegenerative** disease of cattle; spongy brain/spinal cord; reaches humans by **eating contaminated** brain, spinal cord or gut.", "past": true, "trap": "", "src": "p12"}, {"t": "Agent = **prion**, an infectious misfolded protein, **similar to a virus but not a typical virus**; not alive, so **usual disinfectants fail**; denatured only by **extremely high temperature or very strong chemicals**.", "past": true, "trap": "", "src": "p12"}, {"t": "Prion-gene mutations convert **α-helices into β-sheets**: **PrPc = α-helix, water soluble** · **PrPsc = β-sheet, water insoluble**.", "past": true, "trap": "α → β (not β → α); the disease form PrPsc is β-sheet and insoluble.", "src": "p12"}, {"t": "**p53** (tumour suppressor, **TP53 gene**) regulates the cell cycle: activates **DNA repair**, holds growth arrest at **G1/S**, or starts **apoptosis** if damage is irreparable.", "past": true, "trap": "Growth arrest is at G1/S, not G2/S.", "src": "p13"}, {"t": "One functional TP53 copy → early-adult tumours = **Li-Fraumeni syndrome**; **>50% of tumours** carry TP53 mutation/deletion; **mutagens can damage it**. Arrest-vs-apoptosis choice: cell type, oncogenic composition, stress intensity, p53 level.", "past": true, "trap": "", "src": "p13"}]}]}, {"key": "Lab1", "title": "Lab 1 - Safety & Pipetting", "section": "Mid", "sections": [{"title": "General and personal safety", "points": [{"t": "Two concerns in the lab: **safety** and **efficiency**; **safety comes first**. General rules: clean orderly benches, **label** every stored solution, **fume hoods not for storing chemicals**, no eating/drinking/smoking, never work alone.", "past": true, "trap": "\"Fume hoods should not be used to store chemicals\" is a GENERAL rule, not a personal one.", "src": "p1"}, {"t": "Personal safety: students breaking rules are **asked to leave** and may face **additional sanctions**; no open-toed shoes or short clothes; **tie long hair**; gloves **not worn outside** the lab; wash hands on entering and leaving.", "past": true, "trap": "", "src": "p2"}]}, {"title": "Special rules, accidents and waste", "points": [{"t": "Heating: **never heat sealed containers**, use tongs and insulated gloves, **point the opening away from people**. Dilute acids by pouring **acid into water**, never the opposite.", "past": true, "trap": "", "src": "p3"}, {"t": "**No mouth pipetting** of toxic, biological, strong acid or base solutions (in practice, not even water); use automatic pipettes or pumps. **Flammables** (ether, alcohols, benzene): no naked flame, never **near the oven**.", "past": true, "trap": "", "src": "p3"}, {"t": "Eye splash: open the eyelid, rinse with plenty of water at the eye wash; **acid → 1% NaHCO₃**, **alkali → 1% boric acid**. **Burns: no water**, use a special bandage; report every accident.", "past": true, "trap": "Acid in the eye = NaHCO₃, alkali = boric acid; a heat burn gets a bandage, but an acid splash on the hand gets water.", "src": "p4"}]}, {"title": "Types of pipettes", "points": [{"t": "Classification: **automatic** vs **non-automatic** → non-quantitative (**Pasteur**) or quantitative → **fixed volumetric** or **graduated** (**Mohr** and **serological**).", "past": false, "trap": "", "src": "p5"}, {"t": "**Volumetric (bulb) pipette**: **large bulb**, **single graduation mark** (one volume, 10/25/50 mL), **extremely accurate**, so it **cannot deliver a variable volume**. **Pasteur** = eye/chemical dropper, **not graduated**.", "past": true, "trap": "The large-bulb pipette is the volumetric one, not Mohr or serological.", "src": "p5, p6"}, {"t": "Pick the tool by unit: **drops → Pasteur** · **mL → graduated** (5–50 mL) · **µL → micropipette**.", "past": false, "trap": "", "src": "p6"}, {"t": "**Mohr is more accurate than serological.** Serological is graduated **down to the tip**, so the last mL (**dead zone**) must be delivered; Mohr graduations **stop before the tip**.", "past": false, "trap": "Mohr beats serological in accuracy; students often pick serological.", "src": "p5"}, {"t": "Accuracy ranking: **micropipette > Mohr > serological > Pasteur** (tested by weighing the delivered volume after taring the beaker). Past exam: most convenient **Pasteur**, least accurate graduated **serological**.", "past": true, "trap": "", "src": "p5"}]}, {"title": "Air-displacement micropipette", "points": [{"t": "Measures **0.1–1000 µL** (1 mL) by **piston-driven air displacement**; needs **disposable polypropylene tips** (no adherence); **one tip per solution**. Inaccurate with environment: **air pressure, humidity, temperature, altitude** and user technique.", "past": true, "trap": "Range is in µL, not mL; tips are required; there are 4 standard sizes, not 6.", "src": "p6, p7, p8"}, {"t": "Choose the pipette **whose range contains the volume**: **155 µL → 20–200**. Never set below the minimum or above the maximum (the spring is damaged).", "past": true, "trap": "50 µL must not be taken with a 100–1000 pipette; use 20–200.", "src": "p6"}, {"t": "Tip colours: **P10 white** (smallest) · **P20 and P200 yellow** · **P1000 blue** (largest).", "past": false, "trap": "", "src": "p6"}, {"t": "Stops: **press to first stop outside the liquid** (expels air) → **release with tip in liquid = aspirate** → **press to second stop = dispense the exact full volume** → ejector discards tip.", "past": true, "trap": "The first PRESS expels air; the first RELEASE aspirates.", "src": "p7"}, {"t": "\"How do you aspirate?\" = **add a tip and press the first stop**. The **second stop** is for **dispensing** completely, not aspirating.", "past": true, "trap": "Aspirate = first stop only; \"first and second stops\" is the wrong option.", "src": "p7"}, {"t": "Tip position: **in the middle**, slightly under the surface. Too **superficial** → air bubbles (\"very diluted\"); too **deep** → precipitate (\"very concentrated\").", "past": false, "trap": "", "src": "p8"}, {"t": "Change the tip (sterile work) if you **change sample**, it **touches the flask** or **touches your hand**. **Volume knob and plunger** must be **recalibrated**; the plunger spring loosens with use.", "past": true, "trap": "", "src": "p8"}]}]}, {"key": "Lab2", "title": "Lab 2 - Solutions & Buffers", "section": "Mid", "sections": [{"title": "Solutions", "points": [{"t": "A **solution** = a **homogeneous** mixture of a **solute** and a **solvent**; both can be **gases, liquids or solids**. **All buffers are solutions**, but not all solutions are buffers.", "past": true, "trap": "Solutions are homogeneous; \"non-homogeneous\" and \"all solutions are buffers\" are the wrong options.", "src": "p1"}, {"t": "Examples: O₂ in water · ethanol in water · NaCl in water · **air** (gases in nitrogen) · **H₂ in palladium** · **mercury in gold = amalgam** · radium sulfate in barium sulfate.", "past": false, "trap": "", "src": "p1"}]}, {"title": "Molarity and preparing a solution", "points": [{"t": "**Molarity = moles / L**; moles = mass / molar mass. **1 L of 1.00 M NaCl = 58.44 g**: dissolve in a little water in a 1 L volumetric flask, fill to the line.", "past": false, "trap": "", "src": "p2"}, {"t": "One formula: **grams = MW × V(L) × M** (convert mL and mM ÷ 1000). **10 mL of 100 mM CaCl₂·2H₂O (MW 147) = 0.147 g**.", "past": false, "trap": "Watch the decimal: 0.147 g, not 147 g.", "src": "p2"}, {"t": "Weigh the solute, then add water **up to** 10 mL: the solvent actually used is **less than 10 mL**, because the solute occupies volume.", "past": false, "trap": "Solvent used is LESS than the final volume, not equal to it.", "src": "p2"}]}, {"title": "Normality", "points": [{"t": "**N = M × n** (n = **H⁺ or OH⁻** count): 1 M HCl → **1 N**; 1 M H₂SO₄ → **2 N**; 3 N H₂SO₄ → **1.5 M**; 6 M Al(OH)₃ → **18 N**.", "past": true, "trap": "Given M multiply by n; given N divide by n (6 N H₂SO₄ = 3 M).", "src": "p3"}, {"t": "Count **every H or OH in the formula** (H₂SO₄ 2, Ca(OH)₂ 2, Al(OH)₃ 3): **H₂PO₄ at 6 M → 12 N**. N is **never less than M**; if n = 1, N equals M.", "past": true, "trap": "H₂PO₄ at 6 M = 12 N (count both H), not 6 or 18.", "src": "p3"}]}, {"title": "Dilution", "points": [{"t": "**C1V1 = C2V2** (C1 = initial/stock). 250 mL of 0.10 M NH₃ from **14.8 M** stock: **V1 = 1.7 mL**, then water to 250 mL. \"**Conc**\" on a bottle = the concentrated stock.", "past": false, "trap": "", "src": "p4"}, {"t": "Serial dilution **100 → 10 → 1 mM**, 5 mL each: **0.5 mL** of the stronger tube + **4.5 mL water**; C1 each step = the tube you drew from.", "past": false, "trap": "0.5 mL = 500 µL; options may show it in µL.", "src": "p4"}, {"t": "**10% (w/v)** = 10 g per 100 mL (5 mL needs 0.5 g). **Acetic acid** is a liquid measured by **volume**: density 1, so grams = mL; **MW 60**.", "past": false, "trap": "", "src": "p4"}]}, {"title": "Buffers and pH", "points": [{"t": "A **buffer resists change in pH**: a **weak acid + its conjugate base** (or weak base + conjugate acid). Practically: weak acid + its salt, e.g. **acetic acid + sodium acetate**.", "past": true, "trap": "Choose \"resists change in pH\" over \"has a constant pH\"; strong acid/base pairs are never buffers.", "src": "p5"}, {"t": "**pH = −log[H⁺]**; [H⁺] = 10⁻⁷ → pH 7 (neutral). Each pH unit = **10×** [H⁺]: pH 8 is **100× more acidic** than pH 10; pH 1 → 3 makes [H⁺] **1/100**.", "past": true, "trap": "", "src": "p5"}, {"t": "**pH = pKa + log[A⁻]/[HA]**. [A⁻] = [HA] → **pH = pKa** (best buffer). pH > pKa → **more base**; pH < pKa → **more acid form**. Higher **Ka** = lower pKa = **stronger acid**.", "past": true, "trap": "Higher Ka means LOWER pKa and a stronger acid.", "src": "p5"}, {"t": "**pH meter = most accurate** (gives a number); **pH strips less accurate**. Keep the electrode **immersed** (never dry) and rinse it with **distilled water** before measuring.", "past": false, "trap": "", "src": "p5"}, {"t": "**Phenol red** = organic dye (colorimetric, tells acid or base only): **pH 7 orange** · **acid yellow** · **base purple/pink**.", "past": false, "trap": "Acid = yellow, base = purple/pink; orange is neutral.", "src": "p5"}, {"t": "Buffer types: **synthetic** (lab-made) and **physiological**: **bicarbonate** (most important in blood, H₂CO₃ ⇌ HCO₃⁻ + H⁺), **proteins (haemoglobin)**, **phosphate** (H₂PO₄⁻ weak acid ⇌ H⁺ + HPO₄²⁻).", "past": false, "trap": "", "src": "p6"}]}]}];
