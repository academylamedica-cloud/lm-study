let cur=null,filt='all',scope='one';
const list=d=>{const a=[];d.sections.forEach((s,si)=>(s.points||[]).forEach((p,pi)=>a.push({id:d.key+'-'+si+'-'+pi,p})));return a};
const match=(x,f)=>{const v=S[x.id]||{};return f==='all'||(f==='past'&&x.p.past)||(f==='trap'&&!!x.p.trap)||(f==='star'&&!!v.star)||(f==='rev'&&!!v.rev)||(f==='todo'&&!v.ok)};
function stats(ds){let n=0,o=0,r=0,past=0,traps=0;ds.forEach(d=>list(d).forEach(x=>{const v=S[x.id]||{};n++;if(v.ok)o++;if(v.rev)r++;if(x.p.past)past++;if(x.p.trap)traps++}));return{n,o,r,past,traps}}
function ring(p,size,label){const R=size/2-3,C=2*Math.PI*R;return `<div class="ring ${p>=1?'full':''}"><svg width="100%" height="100%" viewBox="0 0 ${size} ${size}"><circle class="bgc" cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke-width="3.5"/><circle class="fg" cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg>${label!=null?`<em>${label}</em>`:''}</div>`}
const short=d=>{const m=d.title.match(/^(L\d+|Lab ?\d)\s*[-–]\s*(.*)$/);return m?[m[1].replace(' ',''),m[2]]:[d.key,d.title]};

function hero(anim){const ds=scope==='all'?DATA:[DATA.find(x=>x.key===cur)],t=stats(ds),pc=t.n?t.o/t.n:0;
 const k0=short(ds[0])[0];
 const title=scope==='all'?'<span class="ar">كل المحاضرات</span>':md(short(ds[0])[1]),eb=scope==='all'?'Biochemistry · Mid':(k0.startsWith('Lab')?'Lab '+k0.slice(3):'Lecture '+k0.slice(1));
 return `<div class="hero ${anim?'anim':''}"><div class="row">${ring(pc,70,Math.round(pc*100)+'%')}<div><div class="eyebrow">${eb}</div><h1>${title}</h1><div class="sub">${t.n} exam points · ${t.past} from past years · ${t.traps} traps</div></div></div>
 <div class="hstats ar"><span>درستها <strong>${t.o}</strong></span><span>للمراجعة <strong>${t.r}</strong></span><span>لسّا <strong>${t.n-t.o}</strong></span></div></div>`}
function chipN(k){const ds=scope==='all'?DATA:[DATA.find(x=>x.key===cur)];return ds.reduce((a,d)=>a+list(d).filter(x=>match(x,k)).length,0)}
function panel(){return `<div class="fpanel"><div class="seg"><button data-s="one" class="${scope==='one'?'on':''}">هالمحاضرة<small>نقاط المحاضرة اللي فاتحها</small></button><button data-s="all" class="${scope==='all'?'on':''}">كل المحاضرات<small>كل المادة مع بعض بفلتر واحد</small></button></div>
 <div class="chips">${FIL.map(([k,l])=>`<button class="chip ${filt===k?'on':''}" data-f="${k}">${l}<span class="n">${chipN(k)}</span></button>`).join('')}</div>
 <div class="hint ar">اكبس المربّع لما تخلّص النقطة · ↺ بدّي أراجعها · ★ مهمة · ✎ ملاحظة</div></div>`}
function cls(id,first){const v=S[id]||{};return['pt',first?'first':'',v.ok?'ok':'',v.rev?'rev':'',v.star?'star':'',v.n?'hasn':''].join(' ')}
function point(id,p,n,first){const v=S[id]||{};
 return `<div class="${cls(id,first)}" data-id="${id}"><button class="bx" data-a="ok" aria-label="Studied">${IC.chk}</button>
 <div class="txt"><span class="t">${md(p.t)}</span>${p.past?'<span class="tag">إجا بالسنوات السابقة</span>':''}<span class="acts"><button class="ib rv" data-a="rev" title="بدّي أراجعها">${IC.rv}</button><button class="ib st" data-a="star" title="مهمة">${IC.st}</button><button class="ib nt" data-a="nt" title="ملاحظة">${IC.nt}</button></span>
 ${p.trap?`<div class="trap"><span class="lb">فخ</span><span>${md(p.trap)}</span></div>`:''}</div>
 <textarea class="${v.n||v.open?'':'hide'}" dir="auto" placeholder="اكتب ملاحظتك…">${esc(v.n||'')}</textarea></div>`}
function lectureBody(d){let h='',n=0,total=0;
 d.sections.forEach((s,si)=>{let inner='';
  if(s.table&&filt==='all')inner+=`<div class="card tw"><table><tr>${s.table.head.map(x=>`<th>${md(x)}</th>`).join('')}</tr>${s.table.rows.map(r=>`<tr>${r.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
  if(s.points){const items=s.points.map((p,pi)=>({id:d.key+'-'+si+'-'+pi,p})).filter(x=>match(x,filt));total+=items.length;
   if(items.length)inner+=`<div class="card">`+items.map((x,j)=>point(x.id,x.p,n++,j===0)).join('')+`</div>`}
  if(inner)h+=`<section><div class="sh"><span class="no">${si+1}</span><h2>${md(s.title)}</h2></div>${inner}</section>`});
 return{h,total}}
function page(){let h=hero(1)+panel();
 if(scope==='all'){let any=0;DATA.forEach(d=>{const b=lectureBody(d);if(b.h){any+=b.total;const[k,nm]=short(d);h+=`<a class="lhead" href="#${d.key}"><span class="k">${k}</span><span class="nm">${esc(nm)}</span></a>${b.h}`}});
  if(!any)h+=`<div class="empty">ما في نقاط بهالفلتر لسّا</div>`}
 else{const i=DATA.findIndex(x=>x.key===cur),d=DATA[i],b=lectureBody(d);h+=b.h;if(!b.total&&filt!=='all')h+=`<div class="empty">ما في نقاط بهالفلتر بهالمحاضرة</div>`;
  h+=`<div class="notes"><div class="sh"><span class="no">✎</span><h2 class="ar">ملاحظاتي على المحاضرة</h2></div><textarea data-l="${d.key}" dir="auto" placeholder="أي إشي بدك تتذكره قبل الامتحان…">${esc(S['note-'+d.key]||'')}</textarea></div>`;
  const pv=DATA[i-1],nx=DATA[i+1];
  h+=`<div class="nextb">${pv?`<a href="#${pv.key}"><span class="ar">السابقة</span><strong>${esc(pv.title)}</strong></a>`:'<span></span>'}${nx?`<a class="r" href="#${nx.key}"><span class="ar">التالية</span><strong>${esc(nx.title)}</strong></a>`:''}</div>`}
 document.getElementById('page').innerHTML=h;nav();}
let rt=0;function refreshTop(){cancelAnimationFrame(rt);rt=requestAnimationFrame(()=>{document.querySelector('.hero').outerHTML=hero();document.querySelectorAll('.chip').forEach(c=>c.querySelector('.n').textContent=chipN(c.dataset.f));nav()})}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function confetti(){const c=document.getElementById('conf'),cols=['#41C1CA','#0E7C7B','#E3A008','#F28B82','#7FD8D7'];
 for(let i=0;i<40;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'vw';p.style.background=cols[i%5];p.style.animationDelay=Math.random()*.4+'s';p.style.animationDuration=1.2+Math.random()*.9+'s';c.appendChild(p);setTimeout(()=>p.remove(),2600)}}
const setOpen=o=>document.body.classList.toggle('closed',!o);
document.addEventListener('click',e=>{if(e.target.id==='shade')return setOpen(false);const b=e.target.closest('button');if(!b)return;
 if(b.id==='open')return setOpen(true);if(b.id==='close')return setOpen(false);
 if(b.dataset.s){scope=b.dataset.s;page();return}
 if(b.dataset.f){filt=b.dataset.f;page();return}
 const el=b.closest('.pt');if(!el||!b.dataset.a)return;const id=el.dataset.id,v=S[id]=S[id]||{},first=el.classList.contains('first');
 if(b.dataset.a==='nt'){const ta=el.querySelector('textarea');ta.classList.toggle('hide');v.open=!ta.classList.contains('hide');if(v.open)ta.focus();save();return}
 const d=DATA.find(x=>x.key===id.split('-')[0]),before=stats([d]).o;
 v[b.dataset.a]=!v[b.dataset.a];save();el.className=cls(id,first);
 if(b.dataset.a==='ok'&&v.ok&&navigator.vibrate)try{navigator.vibrate(8)}catch(_){}
 refreshTop();const t=stats([d]);
 if(b.dataset.a==='ok'&&v.ok&&t.o===t.n&&before<t.n){confetti();toast('خلّصت '+short(d)[0]+' كاملة، يعطيك العافية')}
 else if(b.dataset.a==='ok'&&v.ok&&t.o===Math.ceil(t.n/2)&&before<t.o)toast('نص الطريق، كمّل');});
document.addEventListener('input',e=>{const ta=e.target;if(ta.tagName!=='TEXTAREA')return;
 if(ta.dataset.l)S['note-'+ta.dataset.l]=ta.value;else{const el=ta.closest('.pt');(S[el.dataset.id]=S[el.dataset.id]||{}).n=ta.value;el.className=cls(el.dataset.id,el.classList.contains('first'))}save();});
function route(){const k=(location.hash||'').slice(1);if(!k||!DATA.some(d=>d.key===k))return;cur=k;scope='one';if(!wide())setOpen(false);page();scrollTo({top:0})}
addEventListener('hashchange',route);
cur=DATA[0].key;setOpen(true);page();route();
</script></body></html>
