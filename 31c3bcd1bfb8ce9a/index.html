<style>
:root{
 --bg:#F7F6F2;--card:#FFFFFF;--ink:#1C2D2D;--soft:#55666A;--mute:#8A979A;--line:#ECEAE4;
 --teal:#0E7C7B;--tealbg:#E6F4F3;--tealbg2:#F1FAF9;--hero1:#0E7C7B;--hero2:#2FA9AE;
 --amber:#C26A0A;--amberbg:#FFF1DE;--coral:#D9534F;--coralbg:#FDEDEB;--gold:#E3A008;--goldbg:#FFF7DB;
 --shadow:0 1px 2px rgba(28,45,45,.04),0 6px 18px rgba(28,45,45,.06);--r:16px;--sw:290px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0E1716;--card:#16211F;--ink:#E7EFEE;--soft:#B5C3C2;--mute:#7F8E8D;--line:#24312F;
 --teal:#5CCBC8;--tealbg:#17312F;--tealbg2:#132826;--hero1:#0B5F5E;--hero2:#16807F;--amber:#F2B45C;--amberbg:#352713;
 --coral:#F28B82;--coralbg:#3A1E1C;--gold:#F5C842;--goldbg:#332B12;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#0E1716;--card:#16211F;--ink:#E7EFEE;--soft:#B5C3C2;--mute:#7F8E8D;--line:#24312F;
 --teal:#5CCBC8;--tealbg:#17312F;--tealbg2:#132826;--hero1:#0B5F5E;--hero2:#16807F;--amber:#F2B45C;--amberbg:#352713;
 --coral:#F28B82;--coralbg:#3A1E1C;--gold:#F5C842;--goldbg:#332B12;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15.5px;line-height:1.55}
.ar{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif}
b{font-weight:600;color:var(--teal)}
button{font:inherit;color:inherit}
.burger{width:42px;height:42px;border:0;border-radius:13px;background:var(--card);box-shadow:var(--shadow);cursor:pointer;display:grid;place-content:center;gap:5px;flex:none;transition:transform .15s}
.burger:active{transform:scale(.94)}
.burger i{display:block;width:18px;height:2px;border-radius:2px;background:var(--ink)}
aside{position:fixed;top:0;bottom:0;left:0;width:var(--sw);background:var(--card);z-index:9;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--line);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
body.closed aside{transform:translateX(-100%)}
.wrap{margin-left:var(--sw);transition:margin .38s cubic-bezier(.2,.8,.2,1);min-height:100vh}
body.closed .wrap{margin-left:0}
.shade{display:none}
.dh{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.dh .lg svg{height:30px;width:auto;display:block}
.dh .tt{font-weight:600;font-size:14.5px;line-height:1.2}.dh .ts{font-size:12px;color:var(--mute)}
.dh .burger{margin-left:auto;box-shadow:none;background:var(--bg)}
.dsum{margin:6px 14px 10px;padding:12px 14px;border-radius:14px;background:var(--tealbg2);display:flex;align-items:center;gap:12px}
.dsum .tx{font-size:13px;color:var(--soft)}.dsum .tx strong{display:block;font-size:14.5px;color:var(--ink)}
.dl{overflow:auto;padding:0 10px 16px;flex:1}
.grp{font-size:11.5px;font-weight:600;letter-spacing:.08em;color:var(--mute);margin:14px 8px 6px;text-transform:uppercase}
.dl a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:13px;color:inherit;text-decoration:none;transition:background .2s}
.dl a:hover{background:var(--bg)}.dl a.on{background:var(--tealbg)}
.dl a .k{font-weight:700;font-size:13px;color:var(--teal);width:38px;flex:none}
.dl a .nm{flex:1;min-width:0;font-size:14px;line-height:1.3}
.ring{width:30px;height:30px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg);display:block}
.ring .bgc{stroke:var(--line)}.ring .fg{stroke:var(--teal)}.hero .ring .fg{transition:stroke-dashoffset .5s ease}
.ring.full .fg{stroke:var(--gold)}
.ring em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:9.5px;font-weight:700;color:var(--soft)}
.topb{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--bg);}
.topb .lbl{font-size:13px;color:var(--soft)}
body:not(.closed) .topb #open{visibility:hidden}
main{max-width:860px;margin:0 auto;padding:4px 18px 110px;overflow-x:clip}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 22px 18px;color:#fff;background:linear-gradient(135deg,var(--hero1),var(--hero2));box-shadow:0 10px 30px rgba(14,124,123,.25)}
.hero.anim{animation:rise .45s ease both}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{content:"";position:absolute;right:60px;bottom:-90px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .row{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.hero .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero h1{margin:2px 0 0;font-size:26px;line-height:1.2}
.hero .sub{margin-top:4px;font-size:13.5px;opacity:.9}
.hero .ring{width:70px;height:70px}.hero .ring .bgc{stroke:rgba(255,255,255,.25)}.hero .ring .fg{stroke:#fff}.hero .ring.full .fg{stroke:#FFE08A}
.hero .ring em{color:#fff;font-size:16px}
.hstats{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1;direction:rtl}
.hstats span{background:rgba(255,255,255,.16);border-radius:999px;padding:5px 13px;font-size:13px;display:flex;gap:7px;align-items:baseline}
.hstats strong{font-size:16px}
.fpanel{margin-top:14px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px 12px 10px;direction:rtl}
.fpanel .fh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 4px 10px}
.fpanel .fh .t{font-weight:600;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:16px;padding:5px;gap:5px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:12px;padding:10px 8px;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:15px;font-weight:600;cursor:pointer;color:var(--soft);transition:background .2s,color .2s;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.3}
.seg button small{font-size:11.5px;font-weight:400;color:var(--mute)}
.seg{background:linear-gradient(135deg,#FFF6D6,#FCE7A8);box-shadow:0 0 0 1px #F2D27A inset;animation:glow 2.4s ease-in-out infinite}
.seg button{color:#8A6410}.seg button small{color:#A8833A}
.seg button.on{position:relative;overflow:hidden;color:#4A3300;background:linear-gradient(135deg,#F9D54A 0%,#E9B10C 45%,#FFE58A 60%,#D99A06 100%);box-shadow:0 4px 14px rgba(217,154,6,.45),inset 0 1px 0 rgba(255,255,255,.6)}
.seg button.on small{color:#5E4300}
.seg button.on::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px #F2D27A inset,0 0 0 0 rgba(233,177,12,.0)}50%{box-shadow:0 0 0 1px #F2D27A inset,0 0 18px 2px rgba(233,177,12,.45)}}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;display:flex;gap:6px;align-items:center}
.chip:active{transform:scale(.96)}
.chip .n{font-size:11px;background:var(--bg);border-radius:999px;padding:0 7px;color:var(--soft)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}.chip.on .n{background:rgba(255,255,255,.22);color:#fff}
.fpanel .hint{font-size:12px;color:var(--mute);margin:10px 4px 0}
.lhead{display:flex;align-items:center;gap:10px;margin:30px 4px 4px;text-decoration:none;color:inherit}
.lhead .k{background:var(--teal);color:#fff;border-radius:9px;padding:2px 9px;font-weight:700;font-size:13px}
.lhead .nm{font-weight:600;font-size:16px}
section{margin-top:20px}
.sh{display:flex;align-items:center;gap:10px;margin:0 4px 10px}
.sh .no{width:26px;height:26px;border-radius:9px;background:var(--tealbg);color:var(--teal);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.sh h2{margin:0;font-size:15.5px;font-weight:600}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;min-width:0}
section{content-visibility:auto;contain-intrinsic-size:auto 600px}
.pt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 10px;padding:12px 14px;border-top:1px solid var(--line);transition:background .25s}
.pt.first{border-top:0}
.pt.ok{background:var(--tealbg2)}
.pt.rev{box-shadow:inset 3px 0 0 var(--amber)}
.bx{width:24px;height:24px;margin-top:1px;border-radius:8px;border:2px solid #C9D2D1;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;transition:background .25s,border-color .25s}
.bx svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s .05s}
.pt.ok .bx{background:var(--teal);border-color:var(--teal);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.pt.ok .bx svg{stroke-dashoffset:0}
.txt{min-width:0;overflow-wrap:anywhere}
.pt.ok .txt>.t{color:var(--soft)}
.acts{display:inline-flex;gap:1px;vertical-align:-7px;margin-left:6px;white-space:nowrap}
.ib{width:28px;height:28px;border:0;background:transparent;border-radius:8px;display:inline-grid;place-items:center;cursor:pointer;color:#B3BEBD;padding:0;transition:background .2s,color .2s,transform .15s}
.ib:hover{background:var(--bg);color:var(--soft)}.ib:active{transform:scale(.9)}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pt.rev .rv{color:var(--amber);background:var(--amberbg)}
.pt.star .st{color:var(--gold);background:var(--goldbg)}.pt.star .st svg{fill:currentColor}
.pt.hasn .nt{color:var(--teal);background:var(--tealbg)}
.tag{display:inline-block;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:11px;font-weight:600;border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:1px;background:var(--amberbg);color:var(--amber);white-space:nowrap}
.trap{margin-top:7px;display:flex;gap:8px;align-items:flex-start;background:var(--coralbg);color:var(--coral);border-radius:12px;padding:7px 11px;font-size:14px}
.trap .lb{flex:none;font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:12px;background:var(--card);border-radius:999px;padding:0 8px;margin-top:1px}
textarea{grid-column:2;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;background:var(--bg);color:var(--ink);min-height:60px;resize:vertical;outline:none}
textarea:focus{border-color:var(--teal)}
.tw{overflow-x:auto;padding:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--teal);text-align:left;padding:10px 12px;font-weight:600;background:var(--tealbg2)}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}td:first-child{font-weight:600}
.notes{margin-top:30px}.notes textarea{min-height:110px;background:var(--card);box-shadow:var(--shadow);border-color:transparent}
.nextb{margin-top:26px;display:flex;justify-content:space-between;gap:10px}
.nextb a{flex:1;text-decoration:none;color:inherit;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--soft)}
.nextb a strong{display:block;color:var(--ink);font-size:14.5px}.nextb a.r{text-align:right}
.empty{padding:28px;text-align:center;color:var(--mute);direction:rtl}
.hide{display:none!important}
.foot{margin-top:36px;text-align:center;color:var(--mute);font-size:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:11px 20px;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:all .4s cubic-bezier(.2,.8,.2,1);z-index:12;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.conf{position:fixed;inset:0;pointer-events:none;z-index:13;overflow:hidden}
.conf i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:899px){
 aside{width:300px;max-width:calc(100vw - 48px);box-shadow:0 20px 60px rgba(0,0,0,.2);border-right:0;border-radius:0 22px 22px 0}
 .wrap,body.closed .wrap{margin-left:0}
 .shade{display:block;position:fixed;inset:0;background:rgba(14,23,22,.32);z-index:8;transition:opacity .3s}
 body.closed .shade{opacity:0;pointer-events:none}
 body:not(.closed) .topb #open{visibility:visible}
 main{padding:4px 14px 110px}.hero{padding:18px 16px 16px;border-radius:20px}.hero h1{font-size:21px}.hero .ring{width:60px;height:60px}
 .pt{padding:12px}}
